# OpenRiot YAML Package Configuration
# OpenBSD pkg_add package list for OpenBSD 7.9
# Only includes packages that exist in OpenBSD packages/
# Base system packages (doas, less, man, etc.) are NOT listed

core:
    base:
        packages:
            - rsync-3.4.1
            - bc-gh-7.1.0p0
            - python-3.13.12
            - fastfetch-2.60.0
            - jq-1.8.1
        configs:
            - pattern: fastfetch/*
        commands:
            - "git config --global pull.rebase true"
            - "git config --global init.defaultBranch master"
        depends: []
        start: "Installing base tools"
        end: "Base tools installed"
        type: "Package"
        critical: true

    shell:
        packages:
            - fish-4.6.0
            - neovim-0.12.0
            - foot-1.26.1
            - fzf-0.70.0
            - ripgrep-15.1.0
            - htop-3.4.1
            - btop-1.4.6
            - tree-0.62
            - fd-10.4.2
            - gnupg-2.5.18
            - meson-1.10.2v0
            - ninja-1.11.1p1v1
        configs:
            - pattern: fish/*
              preserve_if_exists: [conf.d/*.fish]
            - pattern: nvim/*
              preserve_if_exists: [init.lua]
            - pattern: btop/themes/*
            - pattern: btop/btop.conf
        depends: [core.base]
        start: "Installing shell and terminal tools"
        end: "Shell environment configured"
        type: "Package"
        critical: true
        commands:

desktop:
    sway:
        packages:
            - sway-1.11p0
            - waybar-0.15.0p0
            - fuzzel-1.14.1
            - swaylock-1.8.4
            - swayidle-1.9.0
            - swaybg-1.2.2
            - grim-1.5.0
            - slurp-1.5.0
            - wl-clipboard-2.2.1pl20251124
            - ImageMagick-6.9.13.43
            - wf-recorder-0.6.0p1
        configs:
            - pattern: sway/*
              preserve_if_exists:
                  [
                      monitors.conf,
                      keybindings.conf,
                      swayidle.conf,
                      windowrules.conf,
                  ]
            - pattern: waybar/*
              preserve_if_exists: [UserWorkspaces, UserModules]
            - pattern: fonts/*
              target: "~/.local/share/fonts"
            - pattern: foot/*
            - pattern: fuzzel/*
        commands:
            - "cp $HOME/.local/share/openriot/config/applications/*.desktop ~/.local/share/applications/ 2>/dev/null || true"
        depends: [core.base]
        start: "Installing Sway desktop"
        end: "Sway desktop installed"
        type: "Package"
        critical: true

    apps:
        packages:
            - firefox-149.0
            - flare-messenger-0.17.5p0
            - tdesktop-6.6.4p0
            - helix-25.07.1
            - lsd-1.1.5p2
            - lf-41
        configs:
            - pattern: gtk-3.0/*
            - pattern: gtk-4.0/*
            - pattern: helix/*
              preserve_if_exists: [config.toml]
            - pattern: lf/*
            - pattern: crypto.toml
              preserve_if_exists: [crypto.toml]
        depends: [core.base, desktop.sway]
        start: "Installing desktop applications"
        end: "Desktop applications installed"
        type: "Package"
        critical: false

    media:
        packages:
            - transmission-4.1.1
        configs: []
        depends: [core.base, desktop.sway]
        start: "Installing media controls"
        end: "Media controls installed"
        type: "Package"
        critical: false

source:
    wlsunset:
        type: "Source"
        build:
            - "git clone --depth=1 https://git.sr.ht/~kennylevinsen/wlsunset /tmp/wlsunset"
            - "cd /tmp/wlsunset && meson setup build --prefix=/usr/local --buildtype=release"
            - "cd /tmp/wlsunset && meson compile -C build"
            - "doas meson install -C build"
        start: "Building wlsunset from source"
        end: "wlsunset built"

    crush:
        type: "Source"
        build:
            - "go install github.com/charmbracelet/crush@latest"
            - "mkdir -p $HOME/.local/bin"
            - "mv $HOME/go/bin/crush $HOME/.local/bin/crush"
        depends: [system.tools]
        start: "Building crush AI CLI"
        end: "crush built"

    bibata-cursor:
        type: "Source"
        build:
            - "curl -fsSL https://github.com/ful1e5/Bibata_Cursor/releases/download/v2.0.7/Bibata-Modern-Ice.tar.xz -o /tmp/bibata.tar.xz"
            - "mkdir -p $HOME/.local/share/icons"
            - "tar -xf /tmp/bibata.tar.xz -C /tmp"
            - "mv /tmp/Bibata-Modern-Ice $HOME/.local/share/icons/"
            - "rm -f /tmp/bibata.tar.xz"
            - "gtk-update-icon-cache -f $HOME/.local/share/icons/Bibata-Modern-Ice 2>/dev/null || true"
        depends: [system.tools]
        start: "Installing Bibata-Modern-Ice cursor theme"
        end: "Bibata cursor installed"

system:
    tools:
        packages:
            - wget-1.25.0p0
            - unzip-6.0p18
            - xz-5.8.2
            - isc-dhcp-client-4.4.3pl1p4
            - go-1.26.1
            - chafa-1.16.2
        commands:
            # fw_update removed - requires internet, not needed for offline install
        depends: [core.base]
        start: "Installing system tools"
        end: "System tools installed"
        type: "Package"
        critical: true
# NOT NEEDED FOR OPENBSD (kept for reference)
# These OpenRiot packages have no OpenBSD equivalent:
#
# secure-boot: OpenBSD has its own boot security
# hyprland: replaced by sway
# hyprlock: replaced by swaylock
# hypridle: replaced by swayidle
# hyprshot: replaced by grim
# wofi: replaced by fuzzel (fuzzel is available on OpenBSD, matches ArchRiot)
# kitty: replaced by foot (Wayland native)
# ghostty: not in OpenBSD packages
# paru/yay: replaced by pkg_add
# brightnessctl: no equivalent on OpenBSD
# networkmanager: replaced by ifconfig/hostname.if
# systemd: OpenBSD uses rc.d
# starship: not used (custom fish_prompt used instead)
# NVIDIA drivers: poor support, use Intel iGPU
# bolt/Logitech stuff: no Bluetooth on OpenBSD
# brave/chrome: use firefox
# signal-desktop: not in OpenBSD packages
# telegram-desktop: not in OpenBSD packages
# kanshi: not in OpenBSD packages (display config done differently)
# wl-clipboard: not in OpenBSD packages
# xdg-desktop-portal-wlr: not in OpenBSD packages
# thunar-volman: not in OpenBSD packages
# wl-clipboard: not in OpenBSD packages
# iwx-firmware: firmware is in OpenBSD base system
# urtwn-firmware: firmware is in OpenBSD base system
# doas: part of OpenBSD base system
# less: part of OpenBSD base system
# waybar: exists in OpenBSD packages under wayland/ subdirectory
