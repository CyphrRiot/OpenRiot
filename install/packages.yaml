# OpenRiot YAML Package Configuration
# OpenBSD pkg_add package list for OpenBSD 7.9
# Only includes packages that exist in OpenBSD packages/
# Base system packages (doas, less, man, etc.) are NOT listed

core:
    base:
        packages:
            - rsync-3.4.1
            - bc-gh-7.1.0p0
            - python-3.13.12
            - fastfetch-2.60.0
            - jq-1.8.1
        configs:
            - pattern: fastfetch/*
        depends: []
        start: "Installing base tools"
        end: "Base tools installed"
        type: "Package"
        critical: true

    shell:
        packages:
            - fish-4.6.0

            - foot-1.26.1
            - havoc-0.7.0
            - fzf-0.70.0
            - ripgrep-15.1.0
            - htop-3.4.1
            - btop-1.4.6
            - fd-10.4.2
            - gnupg-2.5.18
            - meson-1.10.2v0
            - ninja-1.11.1p1v1
        configs:
            - pattern: fish/*
              preserve_if_exists: [custom_commands.fish, ssh-agent.fish, config.fish]

            - pattern: btop/themes/*
            - pattern: btop/btop.conf
            - pattern: foot/*
        depends: [core.base]
        start: "Installing shell and terminal tools"
        end: "Shell environment configured"
        type: "Package"
        critical: true
        commands:
            - desc: "Adding fish to /etc/shells"
              cmd: "if ! grep -q '^/usr/local/bin/fish$' /etc/shells 2>/dev/null; then echo '/usr/local/bin/fish' | doas tee -a /etc/shells >/dev/null; fi"
            - desc: "Setting fish as default shell"
              cmd: "doas chsh -s /usr/local/bin/fish"
            - desc: "Customizing login message"
              cmd: "doas tee /etc/motd < $HOME/.local/share/openriot/install/motd"

desktop:
    i3:
        packages:
            - i3-4.25.1
            - i3lock-2.15
            - i3status-2.15p0
            - polybar-3.7.2
            - rofi-1.7.9.1
            - scrot-1.12.1
            - feh-3.10.3
            - picom-11.2p0
            - xclip-0.13p1
            - ImageMagick-6.9.13.43
            - dunst-1.13.1
            - clipmenu-6.2.0
            - clipnotify-1.0.2
            - dmenu-5.7
            - libqalculate-5.8.0p1
            - redshift-1.12p11
        configs:
            - pattern: i3/*
              preserve_if_exists:
                  [
                      keybindings.conf,
                      monitors.conf,
                      windowrules.conf,
                  ]
            - pattern: backgrounds/*
              target: "~/.local/share/openriot/backgrounds"
            - pattern: polybar/*
            - pattern: rofi/*
            - pattern: dunst/*
            - pattern: bin/*
              target: "~/.local/share/openriot/config/bin"
              preserve_if_exists: [openriot-lock.sh]
            - pattern: fonts/*
              target: "~/.local/share/fonts"
            - pattern: Xresources
              target: "~/.Xresources"
            - pattern: xinitrc/*
              target: "~/.xinitrc"
            - pattern: xsession/*
              target: "~/.xsession"
        commands:
            - desc: "Installing autotiling"
              cmd: "pip install autotiling --break-system-packages 2>/dev/null || pip install autotiling 2>/dev/null || true"
        depends: [core.base, fonts.fira-code]
        start: "Installing i3 desktop"
        end: "i3 desktop installed"
        type: "Package"
        critical: true

    i3-auto-layout:
        type: "Source"
        build:
            - "if [ -x /usr/local/bin/i3-auto-layout ]; then echo '[SKIP] i3-auto-layout already installed'; else curl -fsSL https://github.com/chmln/i3-auto-layout/releases/download/v0.1.0/i3-auto-layout -o /tmp/i3-auto-layout && doas mv /tmp/i3-auto-layout /usr/local/bin/i3-auto-layout && doas chmod +x /usr/local/bin/i3-auto-layout; fi"
        depends: [desktop.i3]
        start: "Installing i3-auto-layout"
        end: "i3-auto-layout installed"

    rofi-calc:
        type: "Source"
        build:
            - "if [ -x /usr/local/lib/rofi/librofi-calc.so ]; then echo '[SKIP] rofi-calc already installed'; else rm -rf /tmp/rofi-calc && git clone https://github.com/svenstaro/rofi-calc.git /tmp/rofi-calc && cd /tmp/rofi-calc && meson setup build --prefix=/usr/local && meson compile -C build && doas meson install -C build; fi"
        depends: [desktop.i3]
        start: "Building rofi-calc from source"
        end: "rofi-calc installed"

    apps:
        packages:
            - firefox-149.0
            - flare-messenger-0.17.5p0
            - tdesktop-6.6.4p0
            - helix-25.07.1
            - lsd-1.1.5p2
            - thunar-4.20.8p0
            - thunar-archive-0.6.0
            - thunar-vcs-0.4.0
            - xfce4-settings-4.20.1p0
            - lf-41
            - abiword-3.0.5p2v0
        configs:
            - pattern: gtk-3.0/*
            - pattern: gtk-4.0/*
            - pattern: Thunar/*
              target: "~/.config/Thunar/"
            - pattern: helix/*
              preserve_if_exists: [config.toml]
            - pattern: crypto.toml
              preserve_if_exists: [crypto.toml]
            - pattern: applications/*
              target: "~/.local/share/applications/"
        depends: [core.base, desktop.i3]
        start: "Installing desktop applications"
        end: "Desktop applications installed"
        type: "Package"
        critical: false

    media:
        packages:
            - mpv-0.41.0p0
            - transmission-4.1.1
        configs: []
        depends: [core.base, desktop.i3]
        start: "Installing media controls"
        end: "Media controls installed"
        type: "Package"
        critical: false


    crush:
        type: "Source"
        build:
            - "if [ -x /usr/local/bin/crush ]; then echo '[SKIP] crush already installed'; else curl -fsSL 'https://github.com/charmbracelet/crush/releases/download/v0.55.1/crush_0.55.1_Openbsd_x86_64.tar.gz' -o /tmp/crush.tar.gz && tar -xzf /tmp/crush.tar.gz -C /tmp && doas mv /tmp/crush_0.55.1_Openbsd_x86_64/crush /usr/local/bin/crush && doas chmod +x /usr/local/bin/crush && rm -rf /tmp/crush.tar.gz /tmp/crush_0.55.1_Openbsd_x86_64; fi"
        depends: []
        start: "Installing crush AI CLI"
        end: "crush installed"

    bibata-cursor:
        type: "Source"
        build:
            - "if [ -d \"$HOME/.local/share/icons/Bibata-Modern-Ice\" ]; then echo '[SKIP] Bibata cursor already installed'; else mkdir -p $HOME/.local/share/icons && curl -fsSL https://github.com/ful1e5/Bibata_Cursor/releases/download/v2.0.7/Bibata-Modern-Ice.tar.xz -o /tmp/bibata.tar.xz && cd /tmp && xz -d bibata.tar.xz && tar -xf bibata.tar && mv /tmp/Bibata-Modern-Ice $HOME/.local/share/icons/ && rm -f /tmp/bibata.tar.xz && gtk-update-icon-cache -f $HOME/.local/share/icons/Bibata-Modern-Ice 2>/dev/null || true; fi"
        depends: [system.tools]
        start: "Installing Bibata-Modern-Ice cursor theme"
        end: "Bibata cursor installed"

    stormy:
        type: "Source"
        build:
            - "if [ -x /usr/local/bin/stormy ]; then echo '[SKIP] stormy already installed'; else go install github.com/ashish0kumar/stormy@latest && doas mv \"$HOME/go/bin/stormy\" /usr/local/bin/stormy && doas chmod +x /usr/local/bin/stormy; fi"
        depends: [system.tools]
        start: "Installing stormy weather CLI"
        end: "stormy installed"

fonts:
    fira-code:
        type: "Source"
        build:
            - "if [ -d \"$HOME/.local/share/fonts/FiraCode\" ]; then echo '[SKIP] FiraCode already installed'; else mkdir -p $HOME/.local/share/fonts && curl -fsSL https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/FiraCode.zip -o /tmp/firacode.zip && unzip -o /tmp/firacode.zip -d $HOME/.local/share/fonts/FiraCode && rm -f /tmp/firacode.zip && fc-cache -f; fi"
        depends: []
        start: "Installing FiraCode Nerd Font"
        end: "FiraCode Nerd Font installed"

system:
    tools:
        packages:
            - wget-1.25.0p0
            - unzip-6.0p18
            - xz-5.8.2
            - go-1.26.1
            - chafa-1.16.2
            - age-1.3.1
        commands:
            # fw_update removed - requires internet, not needed for offline install
        depends: [core.base]
        start: "Installing system tools"
        end: "System tools installed"
        type: "Package"
        critical: true
# NOT NEEDED FOR OPENBSD (kept for reference)
# These OpenRiot packages have no OpenBSD equivalent:
#
# secure-boot: OpenBSD has its own boot security
# hyprland: replaced by i3
# hyprlock: replaced by i3lock
# hypridle: not needed on X11
# hyprshot: replaced by scrot
# wofi: replaced by rofi (X11 app launcher)
# kitty: replaced by foot (Wayland native)
# ghostty: not in OpenBSD packages
# paru/yay: replaced by pkg_add
# brightnessctl: no equivalent on OpenBSD
# networkmanager: replaced by ifconfig/hostname.if
# systemd: OpenBSD uses rc.d
# starship: not used (custom fish_prompt used instead)
# NVIDIA drivers: poor support, use Intel iGPU
# bolt/Logitech stuff: no Bluetooth on OpenBSD
# brave/chrome: use firefox
# signal-desktop: not in OpenBSD packages
# telegram-desktop: not in OpenBSD packages
# kanshi: not in OpenBSD packages (display config done differently)

# iwx-firmware: firmware is in OpenBSD base system
# urtwn-firmware: firmware is in OpenBSD base system
# doas: part of OpenBSD base system
# less: part of OpenBSD base system
# waybar: replaced by polybar (X11 status bar)
