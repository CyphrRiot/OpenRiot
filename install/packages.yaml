# OpenRiot YAML Package Configuration
# OpenBSD pkg_add package list for OpenBSD 7.9
# Only includes packages that exist in OpenBSD packages/
# Base system packages (doas, less, man, etc.) are NOT listed

core:
    base:
        packages:
            - rsync-3.4.1
            - bc-gh-7.1.0p0
            - python-3.13.12
            - fastfetch-2.60.0
            - jq-1.8.1
        configs:
            - pattern: fastfetch/*
              target: "~/.config/fastfetch"
        depends: []
        start: "Installing base tools"
        end: "Base tools installed"
        type: "Package"
        critical: true

    shell:
        packages:
            - fish-4.6.0

            - alacritty-0.16.1
            - havoc-0.7.0
            - fzf-0.71.0
            - ripgrep-15.1.0
            - htop-3.4.1
            - btop-1.4.6
            - fd-10.4.2
            - gnupg-2.5.18
            - meson-1.10.2v0
            - ninja-1.11.1p1v1
        configs:
            - pattern: fish/*
              preserve_if_exists: [custom_commands.fish, ssh-agent.fish, config.fish]

            - pattern: btop/themes/*
            - pattern: btop/btop.conf
        depends: [core.base]
        start: "Installing shell and terminal tools"
        end: "Shell environment configured"
        type: "Package"
        critical: true
        commands:
            - desc: "Adding fish to /etc/shells"
              cmd: "if ! grep -q '^/usr/local/bin/fish$' /etc/shells 2>/dev/null; then echo '/usr/local/bin/fish' | doas tee -a /etc/shells >/dev/null; fi"
            - desc: "Setting fish as default shell"
              cmd: "doas chsh -s /usr/local/bin/fish $(logname)"
            - desc: "Customizing login message"
              cmd: "doas tee /etc/motd < $HOME/.local/share/openriot/install/motd"

desktop:
    i3:
        packages:
            - i3-4.25.1
            - i3lock-2.15
            - i3status-2.15p0
            - xautolock-2.2
            - polybar-3.7.2
            - rofi-1.7.9.1
            - scrot-1.12.1
            - feh-3.12.1
            - picom-13
            - xclip-0.13p1
            - ImageMagick-6.9.13.43
            - dunst-1.13.1
            - clipmenu-6.2.0
            - clipnotify-1.0.2
            - dmenu-5.4
            - libqalculate-5.8.0p1
            - redshift-1.12p11
        configs:
            - pattern: i3/*
            - pattern: polybar/*
            - pattern: rofi/*
            - pattern: dunst/*
            - pattern: fonts/*
              target: "~/.local/share/fonts"
            - pattern: Xresources
              target: "~/.Xresources"
            - pattern: xinitrc/openriot-x11
              target: "~/.xinitrc"
            - pattern: xsession/openriot-xsession
              target: "~/.xsession"
              # Always overwrite - this is a system config, not user customization
            - pattern: picom.conf
              target: "~/.config/picom.conf"
            - pattern: alacritty/*
              target: "~/.config/alacritty"
            - pattern: nvim/*
            - pattern: lf/*
            - pattern: bin/*
              target: "~/.local/bin"
        commands:
            - desc: "Make all scripts executable"
              cmd: "find ~/.local/share/openriot/config -name \"*.sh\" -exec chmod +x {} \\; 2>/dev/null || true"
            - desc: "Installing autotiling for i3"
              cmd: "if command -v autotiling >/dev/null 2>&1; then echo '[SKIP] autotiling already installed'; elif pip3 install --quiet autotiling 2>&1 | grep -q 'Requirement already satisfied'; then echo '[SKIP] autotiling already installed'; elif pip3 install --quiet autotiling --break-system-packages 2>/dev/null || pip3 install --quiet autotiling 2>/dev/null; then echo '[SKIP] autotiling installed'; else echo '[WARN] autotiling install failed, tiling will be manual'; fi"
            - desc: "Remove deprecated polybar config"
              cmd: "rm -f ~/.config/polybar/config"
            - desc: "Remove deprecated polybar scripts"
              cmd: "rm -f ~/.config/polybar/scripts/*.sh"
        depends: [core.base, fonts.fira-code]
        start: "Installing i3 desktop"
        end: "i3 desktop installed"
        type: "Package"
        critical: true

    i3-auto-layout:
        type: "Source"
        build:
            - "if [ -x /usr/local/bin/i3-auto-layout ]; then echo '[SKIP] i3-auto-layout already installed'; else curl -fsSL https://github.com/chmln/i3-auto-layout/releases/download/v0.2/i3-auto-layout -o /tmp/i3-auto-layout && doas mv /tmp/i3-auto-layout /usr/local/bin/i3-auto-layout && doas chmod +x /usr/local/bin/i3-auto-layout; fi"
        depends: [desktop.i3]
        start: "Installing i3-auto-layout"
        end: "i3-auto-layout installed"

    rofi-calc:
        type: "Source"
        build:
            - "if [ -x /usr/local/lib/rofi/librofi-calc.so ]; then echo '[SKIP] rofi-calc already installed'; else rm -rf /tmp/rofi-calc && git clone https://github.com/svenstaro/rofi-calc.git /tmp/rofi-calc && cd /tmp/rofi-calc && meson setup build --prefix=/usr/local && meson compile -C build && doas meson install -C build; fi"
        depends: [desktop.i3]
        start: "Building rofi-calc from source"
        end: "rofi-calc installed"

    apps:
        packages:
            - firefox-149.0.2
            - tdesktop-6.7.5
            - helix-25.07.1
            - lsd-1.1.5p2
            - thunar-4.20.8
            - thunar-archive-0.6.0
            - thunar-vcs-0.4.0
            - xfce4-settings-4.20.4
            - gnome-themes-extra-3.28p7
            - papirus-icon-theme-20250501p1
            - lf-41
            - abiword-3.0.9pre20260116
            - gnome-text-editor-49.1
        configs:
            - pattern: gtk-3.0/*
            - pattern: gtk-4.0/*
            - pattern: Thunar/*
              target: "~/.config/Thunar/"
            - pattern: xfce4/*
              target: "~/.config/xfce4/"
            - pattern: helix/*
              preserve_if_exists: [config.toml]
            - pattern: crypto.toml
              target: "~/.config/crypto.toml"
              preserve_if_exists: [crypto.toml]
            - pattern: applications/*
              target: "~/.local/share/applications/"
            - pattern: dconf/*
              target: "~/.config/openriot/dconf/"
            - pattern: text-editor/*
              target: "~/.local/share/gtksourceview-5/styles/"
        depends: [core.base, desktop.i3]
        start: "Installing desktop applications"
        end: "Desktop applications installed"
        type: "Package"
        critical: false
        commands:
            - desc: "Import gnome-text-editor dconf settings"
              cmd: "[ -n \"$DISPLAY\" ] && dconf load /org/gnome/TextEditor/ < $HOME/.config/openriot/dconf/org.gnome.TextEditor.ini || echo '[SKIP] No X11, skipping dconf'"

    media:
        packages:
            - mpv-0.41.0p0
            - transmission-4.1.1
        configs:
            - pattern: "transmission-daemon/settings.json"
              target: "~/.config/transmission-daemon"
              preserve_if_exists: [settings.json]
        depends: [core.base, desktop.i3]
        start: "Installing media controls"
        end: "Media controls installed"
        type: "Package"
        critical: false

source:
    crush:
        type: "Source"
        build:
            - "if [ -x /usr/local/bin/crush ]; then echo '[SKIP] crush already installed'; else curl -fsSL 'https://github.com/charmbracelet/crush/releases/download/v0.55.1/crush_0.55.1_Openbsd_x86_64.tar.gz' -o /tmp/crush.tar.gz && tar -xzf /tmp/crush.tar.gz -C /tmp && doas mv /tmp/crush_0.55.1_Openbsd_x86_64/crush /usr/local/bin/crush && doas chmod +x /usr/local/bin/crush && rm -rf /tmp/crush.tar.gz /tmp/crush_0.55.1_Openbsd_x86_64; fi"
        depends: []
        start: "Installing crush AI CLI"
        end: "crush installed"

    bibata-cursor:
        type: "Source"
        build:
            - "if [ -d \"$HOME/.local/share/icons/Bibata-Modern-Ice\" ]; then echo '[SKIP] Bibata cursor already installed'; else mkdir -p $HOME/.local/share/icons && curl -fsSL https://github.com/ful1e5/Bibata_Cursor/releases/download/v2.0.7/Bibata-Modern-Ice.tar.xz -o /tmp/bibata.tar.xz && cd /tmp && xz -d bibata.tar.xz && tar -xf bibata.tar && mv /tmp/Bibata-Modern-Ice $HOME/.local/share/icons/ && rm -f /tmp/bibata.tar.xz && gtk-update-icon-cache -f $HOME/.local/share/icons/Bibata-Modern-Ice 2>/dev/null || true; fi"
        depends: [system.tools]
        start: "Installing Bibata-Modern-Ice cursor theme"
        end: "Bibata cursor installed"

    kora:
        type: "Source"
        build:
            - "if [ -d \"$HOME/.local/share/icons/kora\" ]; then echo '[SKIP] Kora icon theme already installed'; else rm -rf /tmp/kora && git clone https://github.com/bikass/kora.git /tmp/kora && mkdir -p $HOME/.local/share/icons && cp -rf /tmp/kora/kora $HOME/.local/share/icons/ && rm -rf /tmp/kora && gtk-update-icon-cache -f $HOME/.local/share/icons/kora 2>/dev/null || true; fi"
        depends: [system.tools]
        start: "Installing Kora icon theme"
        end: "Kora icon theme installed"

#    stormy:
#        type: "Source"
#        build:
#            - "if [ -x /usr/local/bin/stormy ]; then echo '[SKIP] stormy already installed'; else go install github.com/ashish0kumar/stormy@latest && doas mv $HOME/go/bin/stormy /usr/local/bin/stormy && doas chmod +x /usr/local/bin/stormy; fi"
#        depends: [system.tools]
#        start: "Installing stormy weather CLI"
#        end: "stormy installed"

fonts:
    fira-code:
        type: "Source"
        build:
            - "if [ -d \"$HOME/.local/share/fonts/FiraCode\" ]; then echo '[SKIP] FiraCode already installed'; else mkdir -p $HOME/.local/share/fonts && cp -r $HOME/.local/share/openriot/assets/fonts/* $HOME/.local/share/fonts/ && fc-cache -f; fi"
        depends: []
        start: "Installing FiraCode Nerd Font"
        end: "FiraCode Nerd Font installed"

system:
    tools:
        packages:
            - xz-5.8.3
            - zip-3.0p3
            - wget-1.25.0p0
            - unzip-6.0p18
            - go-1.26.1
            - rclone-1.73.4
            - age-1.3.1
            - wireguard-tools-1.0.20210914p3v0
        depends: [core.base]
        start: "Installing system tools"
        end: "System tools installed"
        type: "Package"
        critical: true

    services:
        type: "Package"
        commands:
            - desc: "Enable apmd (power management)"
              cmd: "doas rcctl enable apmd && doas rcctl set apmd flags -A"
            - desc: "Enable sndiod (audio)"
              cmd: "doas rcctl enable sndiod"
            #- desc: "Enable and start seatd (seat management)"
            #  cmd: "doas rcctl enable seatd && doas rcctl start seatd"
            - desc: "Create WireGuard config directory"
              cmd: "doas mkdir -p /etc/wireguard && doas chmod 700 /etc/wireguard"
            # - desc: "Install Atheros AR9271 WiFi firmware (if adapter present)"
            #  cmd: "if [ -d /etc/firmware ] && ! [ -f /etc/firmware/athn-open-ar9271 ]; then fw_update -v athn 2>/dev/null || (cd /etc/firmware && ftp -o athn-ucode.tgz https://firmware.openbsd.org/firmware/$(uname -r)/athn-ucode.tgz 2>/dev/null && tar -xzf athn-ucode.tgz && rm -f athn-ucode.tgz); fi"
        depends: [core.base]
        start: "Configuring system services"
        end: "System services configured"
