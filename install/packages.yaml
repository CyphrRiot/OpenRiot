# OpenRiot YAML Package Configuration
# OpenBSD pkg_add package list for OpenBSD 7.9
# Only includes packages that exist in OpenBSD packages/
# Base system packages (doas, less, man, etc.) are NOT listed

openbsd_version: "7.9"

# Firmware files for the installer image (OpenBSD 7.9)
# Update these when firmware.openbsd.org updates
firmware:
    - athn-firmware-1.1p4
    - intel-firmware-20260512v0
    - inteldrm-firmware-20250708
    - iwm-firmware-20240410
    - iwx-firmware-20251021p0

core:
    base:
        packages:
            - rsync-3.4.1
            - python-3.13.13
            - fastfetch-2.60.0
            - exfat-fuse-1.4.0
            - xz-5.8.3
            - zip-3.0p3
            - unzip-6.0p18
            - wget-1.25.0p0
            - lowdown-3.0.1
        configs:
            - pattern: fastfetch/*
              target: "~/.config/fastfetch"
        depends: []
        commands:
            - desc: "Create XDG user directories if missing"
              cmd: |
                  for dir in Documents Downloads Music Pictures Videos Code Screenshots; do
                      mkdir -p "$HOME/$dir"
                  done
                  echo "[DONE] XDG directories ensured"
        start: "Installing base tools"
        end: "Base tools installed"
        type: "Package"
        critical: true

    shell:
        packages:
            - fish-4.6.0
            - bash-5.3.9
            - alacritty-0.16.1
            - ripgrep-15.1.0
            - pv-1.10.5
            - btop-1.4.6p0
            - gnupg-2.5.18
            - meson-1.10.2v0
            - ninja-1.11.1p1v1
        configs:
            - pattern: fish/*
              preserve_if_exists: [custom_commands.fish, ssh-agent.fish]
            - pattern: btop/themes/*
            - pattern: btop/btop.conf
        depends: [core.base]
        start: "Installing shell and terminal tools"
        end: "Shell environment configured"
        type: "Package"
        critical: true
        commands:
            - desc: "Adding fish to /etc/shells"
              cmd: "if ! grep -q '^/usr/local/bin/fish$' /etc/shells 2>/dev/null; then echo '/usr/local/bin/fish' | doas tee -a /etc/shells >/dev/null; fi"
            - desc: "Setting fish as default shell"
              cmd: "doas chsh -s /usr/local/bin/fish $(logname)"
            - desc: "Customizing login message"
              cmd: "doas tee /etc/motd < $HOME/.local/share/openriot/install/motd"
desktop:
    i3:
        packages:
            - i3-4.25.1
            - i3lock-2.15
            - i3status-2.15p0
            - xautolock-2.2
            - polybar-3.7.2
            - rofi-1.7.9.1
            - maim-5.8.1p0
            - feh-3.12.1
            - picom-13
            - xclip-0.13p1
            - ImageMagick-6.9.13.43
            - ffmpeg-8.0.1p1v1
            - dunst-1.13.1
            - clipmenu-6.2.0
            # - clipnotify-1.0.2  # Optional: for clipboard change detection scripts
            - libqalculate-5.8.0p1
            - sct-0.5
            - noto-emoji-2.051v0
            - zathura-0.5.14
            - zathura-pdf-poppler-0.3.4
        configs:
            - pattern: i3/*
            - pattern: polybar/*
            - pattern: rofi/*
            - pattern: dunst/*
            - pattern: Xresources
              target: "~/.Xresources"
            - pattern: Xresources
              target: "~/.Xresources"
            - pattern: xinitrc/openriot-x11
              target: "~/.xinitrc"
            - pattern: xsession/openriot-xsession
              target: "~/.xsession"
              # Always overwrite - this is a system config, not user customization
            - pattern: alacritty/*
              target: "~/.config/alacritty"
            - pattern: nvim/*
            - pattern: lf/*
            - pattern: bin/*
              target: "~/.local/bin"
            - pattern: user-dirs.dirs
              target: "~/.config/user-dirs.dirs"
            - pattern: mimeapps.list
              target: "~/.config/mimeapps.list"
        commands:
            - desc: "Make all scripts executable"
              cmd: "find ~/.local/share/openriot/config -name \"*.sh\" -exec chmod +x {} \\; 2>/dev/null || true"
            - desc: "Remove deprecated polybar config"
              cmd: "rm -f ~/.config/polybar/config"
            - desc: "Remove deprecated polybar scripts"
              cmd: "rm -f ~/.config/polybar/scripts/*.sh"
            - desc: "Install xenodm greeter display setup (mirrors on login)"
              cmd: |
                  if [ -f /etc/X11/xenodm/Xsetup_0 ]; then
                      if ! grep -q "OpenRiot xenodm greeter setup" /etc/X11/xenodm/Xsetup_0 2>/dev/null; then
                          if [ ! -f /etc/X11/xenodm/Xsetup_0.orig ]; then
                              doas cp /etc/X11/xenodm/Xsetup_0 /etc/X11/xenodm/Xsetup_0.orig
                          fi
                      else
                          exit 0
                      fi
                  fi
                  doas cp $HOME/.local/share/openriot/config/xenodm/Xsetup_0 /etc/X11/xenodm/Xsetup_0
                  doas chmod +x /etc/X11/xenodm/Xsetup_0
        depends: [core.base, fonts.all]
        start: "Installing i3 desktop"
        end: "i3 desktop installed"
        type: "Package"
        critical: true

    rofi-calc:
        type: "Source"
        build:
            - desc: "Create qalculate config directory"
              cmd: "mkdir -p ~/.config/qalculate/"
            - desc: "Build and install rofi-calc"
              cmd: "$HOME/.local/share/openriot/install/openriot --install-rofi-calc"
        depends: [desktop.i3]
        start: "Building rofi-calc from source"
        end: "rofi-calc installed"
    lock-cache:
        type: "Source"
        build:
            - desc: "Building Lock Images for your screen (~1 min)..."
              cmd: |
                  if [ -z "$DISPLAY" ]; then
                      echo "[SKIP] No X11, skipping lock screen cache"
                  else
                      $HOME/.local/share/openriot/install/openriot --build-lock-cache
                  fi
        depends: [desktop.i3]
        start: "Building Lock Screens... (~1 min)"
        end: "Lock screen images completed"
    apps:
        packages:
            - firefox-150.0
            - tdesktop-6.7.6
            - abaddon-0.2.3
            - solvespace-3.1p1
            - helix-25.07.1
            - lsd-1.1.5p2
            - thunar-4.20.8
            - thunar-archive-0.6.0
            - tumbler-4.20.1p0
            - webp-pixbuf-loader-0.2.7
            - xfconf-4.20.0
            - xfce4-settings-4.20.4
            - gnome-themes-extra-3.28p7
            - papirus-icon-theme-20250501p1
            - lf-41
            - xdg-utils-1.2.1
            - dconf-0.40.0p2
            - libreoffice-26.2.2.2v0
            - gnome-text-editor-49.1
            - qtquickcontrols-5.15.18pl0
            - qtquickcontrols2-5.15.18pl5
            - qtgraphicaleffects-5.15.18pl0
            - qtdeclarative-5.15.18pl22
        configs:
            - pattern: gtk-3.0/*
            - pattern: gtk-4.0/*
            - pattern: Thunar/*
              target: "~/.config/Thunar/"
            - pattern: xfce4/*
              target: "~/.config/xfce4/"
            - pattern: helix/*
            - pattern: zed/settings.json
              target: "~/.config/zed/settings.json"
            - pattern: zed/themes/*
              target: "~/.config/zed/themes/"
            - pattern: crypto.toml
              target: "~/.config/crypto-template.toml"
            - pattern: applications/*
              target: "~/.local/share/applications/"
            - pattern: dconf/*
              target: "~/.config/openriot/dconf/"
            - pattern: text-editor/*
              target: "~/.local/share/gtksourceview-5/styles/"
        depends: [core.base, desktop.i3]
        start: "Installing desktop applications"
        end: "Desktop applications installed"
        type: "Package"
        critical: false
        commands:
            - desc: "Allow Firefox main process to access Downloads"
              cmd: |
                  if [ -f /usr/local/lib/firefox/browser/defaults/preferences/unveil.main ] && ! grep -q "^~/Downloads " /usr/local/lib/firefox/browser/defaults/preferences/unveil.main 2>/dev/null; then
                      echo "~/Downloads rwc" | doas tee -a /usr/local/lib/firefox/browser/defaults/preferences/unveil.main >/dev/null
                  fi
            - desc: "Allow Firefox content process to access Downloads"
              cmd: |
                  if [ -f /usr/local/lib/firefox/browser/defaults/preferences/unveil.content ] && ! grep -q "^~/Downloads " /usr/local/lib/firefox/browser/defaults/preferences/unveil.content 2>/dev/null; then
                      echo "~/Downloads r" | doas tee -a /usr/local/lib/firefox/browser/defaults/preferences/unveil.content >/dev/null
                  fi
            - desc: "Set default applications for file types"
              cmd: |
                  if [ -z "$DISPLAY" ]; then
                      echo "[SKIP] No X11, skipping MIME defaults"
                  else
                      # PDF
                      xdg-mime default org.pwmt.zathura.desktop application/pdf 2>/dev/null || true
                      # Video
                      for v in video/mp4 video/x-matroska video/x-msvideo video/quicktime video/webm video/x-flv video/x-ms-wmv; do
                          xdg-mime default mpv.desktop "$v" 2>/dev/null || true
                      done
                      # Audio
                      for a in audio/mpeg audio/flac audio/wav audio/ogg audio/mp4 audio/opus; do
                          xdg-mime default mpv.desktop "$a" 2>/dev/null || true
                      done
                      # Images
                      for i in image/png image/jpeg image/gif image/bmp image/webp image/x-xpixmap image/x-portable-pixmap; do
                          xdg-mime default feh.desktop "$i" 2>/dev/null || true
                      done
                      # Text / Markdown
                      for t in text/plain text/markdown application/x-shellscript text/x-script; do
                          xdg-mime default org.gnome.TextEditor.desktop "$t" 2>/dev/null || true
                      done
                  fi
            - desc: "Import dconf settings (requires X11)"
              cmd: |
                  if [ -z "$DISPLAY" ]; then
                      echo "[SKIP] No X11, skipping dconf"
                  else
                      dconf load /org/gnome/TextEditor/ < $HOME/.config/openriot/dconf/org.gnome.TextEditor.ini || true
                  fi
            - desc: "Regenerate gdk-pixbuf loader cache for WebP thumbnails"
              cmd: |
                  doas sh -c 'gdk-pixbuf-query-loaders > /usr/local/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache'
    kate:
        packages:
            - kate-26.04.1
        depends: [desktop.apps]
        start: "Installing Kate (Code IDE)..."
        end: "Kate IDE installed"
        type: "Package"
        critical: false

    games:
        packages:
            - 0ad-0.28.0
            - extremetuxracer-0.8.4
            - cromagrally-3.0.1
            - nudoku-8.0.0
            - xgalaga-sdl-2.1.1.0p0
            - openclonk-8.1p7
            - micropolis-20080211p9
            - gottet-1.2.7
            - defendguin-0.0.13
            - supertux-0.6.3p3
            - sdlpop-1.22v0
            - zelda_roth_se-1.1.0p1
            - endless-sky-0.10.12p0
            - openttd-15.3
            - cataclysm-dda-0.Hp1v0
            - taisei-1.4.4
            - angband-4.2.5-sdl
            - wesnoth-1.18.7
            - boswars-2.7p4
            - slash-3.2.2.e8p8
            - brogue-1.15.1
            - frozen-bubble-2.2.0p17
            - heroes-0.21p10
            - teeworlds-0.7.5p1
        depends: [desktop.i3]
        start: "Installing the best games..."
        end: "Games installed"
        type: "Package"
        critical: false

    pacman:
        depends: [desktop.apps]
        start: "Installing pacman"
        end: "pacman installed"
        type: "Source"
        build:
            - desc: "Extracting pacman bundle"
              cmd: |
                  if [ -f /usr/local/bin/pacman ]; then
                      echo "[SKIP] pacman already installed"
                  else
                      doas tar -xzf "$HOME/.local/share/openriot/config/pacman/pacman.tgz" -C /
                  fi

crypto:
    monero:
        type: "Source"
        build:
            - desc: "Checking for Monero wallet GUI"
              cmd: |
                  if [ -f "$HOME/.local/bin/monero-wallet-gui" ]; then
                      echo "[SKIP] monero-wallet-gui already installed"
                      exit 0
                  fi
            - desc: "Installing Monero wallet GUI"
              cmd: |
                  mkdir -p "$HOME/.local/bin" && \
                  tar -xzf "$HOME/.local/share/openriot/config/monero/monero.tgz" -C "$HOME/.local/bin"
        depends: [desktop.apps]
        start: "Installing Monero wallet GUI"
        end: "Monero wallet GUI installed"

    bitcoin:
        type: "Package"
        packages:
            - bitcoin-30.2p0
        configs:
            - pattern: "applications/bitcoin-qt.desktop"
              target: "~/.local/share/applications/bitcoin-qt.desktop"
        depends: [desktop.apps]
        start: "Installing Bitcoin wallet"
        end: "Bitcoin wallet installed"

media:
    media:
        packages:
            - mpv-0.41.0p0
            - mpd-0.24.9
            - socat-1.7.4.1
            - transmission-gtk-4.1.1p0
            - ffmpeg-8.0.1p1v1
            - ffmpegthumbnailer-2.2.2p0
            - yt-dlp-2026.03.17
            - x264-20250909
            - x265-4.1p0
            - cmixer-0.3
        configs:
            - pattern: "rmpc/config.ron"
              target: "~/.config/rmpc/config.ron"
            - pattern: "rmpc/themes/*"
              target: "~/.config/rmpc/themes/"
            - pattern: "transmission/settings.json"
              target: "~/.config/transmission/settings.json"
              preserve_if_exists: [settings.json]
        commands:
            - desc: "Create mpd directories"
              cmd: "mkdir -p ~/.mpd/playlists ~/Music"
            - desc: "Write mpd.conf with ~/Music directory"
              cmd: |
                  if [ ! -f ~/.mpd/mpd.conf ]; then
                      cat > ~/.mpd/mpd.conf << EOF
                  music_directory "$HOME/Music"
                  playlist_directory "$HOME/.mpd/playlists"
                  db_file "$HOME/.mpd/database"
                  state_file "$HOME/.mpd/state"
                  sticker_file "$HOME/.mpd/sticker.sql"
                  bind_to_address "$HOME/.mpd/socket"
                  audio_output {
                      type "fifo"
                      name "my_fifo"
                      path "/tmp/mpd.fifo"
                      format "44100:16:2"
                  }
                  EOF
                  fi
            - desc: "Install cava binary"
              cmd: |
                  if [ ! -f /usr/local/bin/cava ]; then
                      doas mkdir -p /usr/local/bin
                      doas cp "$HOME/.local/share/openriot/config/bin/cava" /usr/local/bin/cava
                      doas chown root:bin /usr/local/bin/cava
                      doas chmod 0755 /usr/local/bin/cava
                  fi
            - desc: "Start mpd and scan music"
              cmd: "mpd ~/.mpd/mpd.conf 2>/dev/null || true"
        depends: [core.base, desktop.i3]
        start: "Installing media controls"
        end: "Media controls installed"
        type: "Package"
        critical: false

source:
    crush:
        type: "Source"
        build:
            - "$HOME/.local/share/openriot/install/openriot --crush-upgrade"
        depends: []
        start: "Installing/upgrading Crush AI CLI"
        end: "crush installed"
    bibata-cursor:
        type: "Source"
        build:
            - "$HOME/.local/share/openriot/install/openriot --install-asset bibata"
        depends: []
        start: "Installing Bibata-Modern-Ice cursor theme"
        end: "Bibata cursor installed"
    kora:
        type: "Source"
        build:
            - "$HOME/.local/share/openriot/install/openriot --install-asset kora"
        depends: []
        start: "Installing Kora icon theme"
        end: "Kora icon theme installed"
    polybar-scaling:
        type: "Source"
        build:
            - desc: "Scaling polybar for display"
              cmd: |
                  if [ -z "$DISPLAY" ]; then
                      echo "[SKIP] No X11, skipping polybar"
                  else
                      $HOME/.local/share/openriot/install/openriot --polybar-setup
                  fi
            - desc: "Scaling dunst for display"
              cmd: |
                  if [ -z "$DISPLAY" ]; then
                      echo "[SKIP] No X11, skipping dunst"
                  else
                      $HOME/.local/share/openriot/install/openriot --dunst-setup
                  fi
            - desc: "Restarting dunst with new config"
              cmd: |
                  if [ -z "$DISPLAY" ]; then
                      echo "[SKIP] No X11, skipping dunst restart"
                  else
                      pkill -9 dunst 2>/dev/null || true
                      echo "[DONE] Dunst restarted with new config"
                  fi
        depends: []
        start: "Scaling polybar and dunst configs for display"
        end: "Polybar and dunst scaled"
fonts:
    all:
        type: "Source"
        build:
            - "$HOME/.local/share/openriot/install/openriot --install-fonts"
        depends: []
        start: "Installing Nerd Fonts"
        end: "Nerd Fonts installed"
    gurk-keybindings:
        type: "Source"
        build:
            - "$HOME/.local/share/openriot/install/openriot --gurk-setup"
        depends: []
        start: "Configuring gurk keybindings"
        end: "gurk keybindings configured"

system:
    tools:
        packages:
            - rclone-1.73.5
            - wireguard-tools-1.0.20210914p3v0
            - sysbench-0.4.8p17
            - ntfs_3g-2022.10.3p1
            - fio-3.41
        depends: [core.base]
        start: "Installing system tools"
        end: "System tools installed"
        type: "Package"
        critical: true
    mac-spoof:
        type: "Source"
        build:
            - "$HOME/.local/share/openriot/install/openriot --random-mac enable"
        depends: [core.base]
        start: "Configuring MAC address randomization"
        end: "MAC randomization configured"
    services:
        type: "Package"
        commands:
            - desc: "Enable and start apmd (adaptive performance)"
              cmd: "doas rcctl enable apmd && doas rcctl set apmd flags -A -a -z 5 && doas rcctl start apmd"
            - desc: "Install apmd resume hook for OpenRiot"
              cmd: |
                  doas mkdir -p /etc/apm
                  doas sh -c 'printf "%s\n" "#!/bin/sh" "/usr/local/bin/openriot --resume" > /etc/apm/resume'
                  doas chmod 755 /etc/apm/resume
            - desc: "Remove stale power/performance sysctls (now runtime-managed)"
              cmd: |
                  if grep -qE '^hw\.(allowpowerdown|perfpolicy)=' /etc/sysctl.conf 2>/dev/null; then
                      doas sed -i '/^hw\.allowpowerdown=/d' /etc/sysctl.conf
                      doas sed -i '/^hw\.perfpolicy=/d' /etc/sysctl.conf
                  fi
            - desc: "Configure login.conf resource limits"
              cmd: |
                  if ! grep -q 'coredump=0' /etc/login.conf 2>/dev/null; then
                      doas sh -c "sed 's/:umask=022:.*/& coredump=0:/' /etc/login.conf > /tmp/login.conf.tmp && mv /tmp/login.conf.tmp /etc/login.conf && cap_mkdb /etc/login.conf"
                  fi
            - desc: "Enable sndiod (audio)"
              cmd: "doas rcctl enable sndiod"
            - desc: "Enable xenodm (X11 display manager)"
              cmd: "rcctl check xenodm >/dev/null 2>&1 || doas rcctl enable xenodm"
            #- desc: "Enable and start seatd (seat management)"
            #  cmd: "doas rcctl enable seatd && doas rcctl start seatd"
            - desc: "Create WireGuard config directory"
              cmd: "doas mkdir -p /etc/wireguard && doas chmod 700 /etc/wireguard"
            - desc: "Harden PF: change pass to pass out (blocks inbound)"
              cmd: |
                  if [ -f /etc/pf.conf ]; then
                      printf '/^pass[[:space:]]/c\npass out\t\t# establish keep-state\n.\nw\nq\n' | doas ed -s /etc/pf.conf
                      echo "[DONE] PF rules hardened: pass → pass out"
                  else
                      echo "[SKIP] pf.conf not found"
                  fi
            - desc: "Remove cupsd from pkg_scripts (opens port 631)"
              cmd: |
                  if grep -q '^pkg_scripts=' /etc/rc.conf.local 2>/dev/null; then
                      doas sed -i 's/\bcupsd\b//g' /etc/rc.conf.local
                      doas sed -i 's/pkg_scripts=[[:space:]]*/pkg_scripts=/' /etc/rc.conf.local
                      doas sed -i 's/pkg_scripts=$/# pkg_scripts=/' /etc/rc.conf.local
                      echo "[DONE] cupsd removed from pkg_scripts"
                  fi
            - desc: "Update firmware (may take several minutes)"
              cmd: "doas fw_update -a"
            # - desc: "Install Atheros AR9271 WiFi firmware (if adapter present)"
            #  cmd: "if [ -d /etc/firmware ] && ! [ -f /etc/firmware/athn-open-ar9271 ]; then fw_update -v athn 2>/dev/null || (cd /etc/firmware && ftp -o athn-ucode.tgz https://firmware.openbsd.org/firmware/$(uname -r)/athn-ucode.tgz 2>/dev/null && tar -xzf athn-ucode.tgz && rm -f athn-ucode.tgz); fi"
        depends: [core.base]
        start: "Configuring system services"
        end: "System services configured"
    i3-restart:
        type: "Source"
        build:
            - desc: "Restarting i3 window manager"
              cmd: |
                  if [ -z "$DISPLAY" ]; then
                      echo "[SKIP] Not in X11, skipping i3 restart"
                  else
                      i3-msg restart
                  fi
        depends: [system.cleanup]
        start: "Restarting i3 window manager"
        end: "i3 restarted"

    cleanup:
        type: "Source"
        build:
            - desc: "Killing polybar before exit"
              cmd: |
                  if [ -z "$DISPLAY" ]; then
                      echo "[SKIP] No X11, skipping polybar kill"
                  else
                      pkill -9 polybar 2>/dev/null || true
                      echo "[DONE] Polybar killed (will restart automatically)"
                  fi
        depends: [desktop.i3, source.polybar-scaling]
        start: "Cleaning up stale menus..."
        end: "Cleanup complete. Polybar restarting..."
