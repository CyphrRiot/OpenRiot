# OpenRiot YAML Package Configuration
# OpenBSD pkg_add package list for OpenBSD 7.9
# Only includes packages that exist in OpenBSD packages/
# Base system packages (doas, less, man, etc.) are NOT listed

openbsd_version: "snapshots"

core:
    base:
        packages:
            - rsync-3.4.1
            - python-3.13.13
            - fastfetch-2.60.0
            - exfat-fuse-1.4.0
            - xz-5.8.3
            - zip-3.0p3
            - unzip-6.0p18
            - wget-1.25.0p0
        configs:
            - pattern: fastfetch/*
              target: "~/.config/fastfetch"
        depends: []
        commands:
            - desc: "Create XDG user directories if missing"
              cmd: |
                  for dir in Documents Downloads Music Pictures Videos Code Screenshots; do
                      mkdir -p "$HOME/$dir"
                  done
                  echo "[DONE] XDG directories ensured"
        start: "Installing base tools"
        end: "Base tools installed"
        type: "Package"
        critical: true

    shell:
        packages:
            - fish-4.6.0
            - bash-5.3.9
            - alacritty-0.16.1
            - ripgrep-15.1.0
            - pv-1.10.5
            - btop-1.4.6p0
            - gnupg-2.5.18
            - meson-1.10.2v0
            - ninja-1.11.1p1v1
        configs:
            - pattern: fish/*
              preserve_if_exists: [custom_commands.fish, ssh-agent.fish]
            - pattern: btop/themes/*
            - pattern: btop/btop.conf
        depends: [core.base]
        start: "Installing shell and terminal tools"
        end: "Shell environment configured"
        type: "Package"
        critical: true
        commands:
            - desc: "Adding fish to /etc/shells"
              cmd: "if ! grep -q '^/usr/local/bin/fish$' /etc/shells 2>/dev/null; then echo '/usr/local/bin/fish' | doas tee -a /etc/shells >/dev/null; fi"
            - desc: "Setting fish as default shell"
              cmd: "doas chsh -s /usr/local/bin/fish $(logname)"
            - desc: "Customizing login message"
              cmd: "doas tee /etc/motd < $HOME/.local/share/openriot/install/motd"
desktop:
    i3:
        packages:
            - i3-4.25.1
            - i3lock-2.15
            - i3status-2.15p0
            - xautolock-2.2
            - polybar-3.7.2
            - rofi-1.7.9.1
            - maim-5.8.1p0
            - feh-3.12.1
            - picom-13
            - xclip-0.13p1
            - ImageMagick-6.9.13.43
            - dunst-1.13.1
            - clipmenu-6.2.0
            # - clipnotify-1.0.2  # Optional: for clipboard change detection scripts
            - libqalculate-5.8.0p1
            - redshift-1.12p11
            - noto-emoji-2.051v0
        configs:
            - pattern: i3/*
            - pattern: icons/*
              target: "~/.local/share/openriot/config/icons/"
            - pattern: polybar/*
            - pattern: rofi/*
            - pattern: dunst/*
            - pattern: Xresources
              target: "~/.Xresources"
            - pattern: xinitrc/openriot-x11
              target: "~/.xinitrc"
            - pattern: xsession/openriot-xsession
              target: "~/.xsession"
              # Always overwrite - this is a system config, not user customization
            - pattern: picom.conf
              target: "~/.config/picom.conf"
            - pattern: alacritty/*
              target: "~/.config/alacritty"
            - pattern: nvim/*
            - pattern: lf/*
            - pattern: bin/*
              target: "~/.local/bin"
            - pattern: user-dirs.dirs
              target: "~/.config/user-dirs.dirs"
        commands:
            - desc: "Make all scripts executable"
              cmd: "find ~/.local/share/openriot/config -name \"*.sh\" -exec chmod +x {} \\; 2>/dev/null || true"
            - desc: "Remove deprecated polybar config"
              cmd: "rm -f ~/.config/polybar/config"
            - desc: "Remove deprecated polybar scripts"
              cmd: "rm -f ~/.config/polybar/scripts/*.sh"
        depends: [core.base, fonts.all]
        start: "Installing i3 desktop"
        end: "i3 desktop installed"
        type: "Package"
        critical: true

    rofi-calc:
        type: "Source"
        build:
            - "$HOME/.local/share/openriot/install/openriot --install-rofi-calc"
        depends: [desktop.i3]
        start: "Building rofi-calc from source"
        end: "rofi-calc installed"
    apps:
        packages:
            - firefox-150.0
            - tdesktop-6.7.6
            - helix-25.07.1
            - lsd-1.1.5p2
            - thunar-4.20.8
            - thunar-archive-0.6.0
            - tumbler-4.20.1p0
            - xfconf-4.20.0
            - xfce4-settings-4.20.4
            - gnome-themes-extra-3.28p7
            - papirus-icon-theme-20250501p1
            - lf-41
            - libreoffice-26.2.2.2v0
            - gnome-text-editor-49.1
        configs:
            - pattern: gtk-3.0/*
            - pattern: gtk-4.0/*
            - pattern: Thunar/*
              target: "~/.config/Thunar/"
            - pattern: xfce4/*
              target: "~/.config/xfce4/"
            - pattern: helix/*
              preserve_if_exists: [config.toml]
            - pattern: crypto.toml
              target: "~/.config/crypto.toml"
              preserve_if_exists: [crypto.toml]
            - pattern: applications/*
              target: "~/.local/share/applications/"
            - pattern: dconf/*
              target: "~/.config/openriot/dconf/"
            - pattern: text-editor/*
              target: "~/.local/share/gtksourceview-5/styles/"
        depends: [core.base, desktop.i3]
        start: "Installing desktop applications"
        end: "Desktop applications installed"
        type: "Package"
        critical: false
        commands:
            - desc: "Allow Firefox main process to access Downloads"
              cmd: |
                  if [ -f /usr/local/lib/firefox/browser/defaults/preferences/unveil.main ] && ! grep -q "^~/Downloads " /usr/local/lib/firefox/browser/defaults/preferences/unveil.main 2>/dev/null; then
                      echo "~/Downloads rwc" | doas tee -a /usr/local/lib/firefox/browser/defaults/preferences/unveil.main >/dev/null
                  fi
            - desc: "Allow Firefox content process to access Downloads"
              cmd: |
                  if [ -f /usr/local/lib/firefox/browser/defaults/preferences/unveil.content ] && ! grep -q "^~/Downloads " /usr/local/lib/firefox/browser/defaults/preferences/unveil.content 2>/dev/null; then
                      echo "~/Downloads r" | doas tee -a /usr/local/lib/firefox/browser/defaults/preferences/unveil.content >/dev/null
                  fi
            - desc: "Import dconf settings (requires X11)"
              cmd: |
                  if [ -z "$DISPLAY" ]; then
                      echo "[SKIP] No X11, skipping dconf"
                  else
                      dconf load /org/gnome/TextEditor/ < $HOME/.config/openriot/dconf/org.gnome.TextEditor.ini
                  fi
    games:
        packages:
            # - xonotic-0.8.6
            - supertux-0.6.3p3
            - sdlpop-1.22v0
            - zelda_roth_se-1.1.0p1
            - endless-sky-0.10.12p0
            - openttd-15.3
            - cataclysm-dda-0.Hp1v0
            - taisei-1.4.4
            - angband-4.2.5-sdl
        depends: [desktop.i3]
        start: "Installing the best games..."
        end: "Games installed"
        type: "Package"
        critical: false

media:
    media:
        packages:
            - mpv-0.41.0p0
            - transmission-4.1.1p0
            - ffmpeg-8.0.1p1v1
            - ffmpegthumbnailer-2.2.2p0
            - yt-dlp-2026.03.17
        configs:
            - pattern: "transmission-daemon/settings.json"
              target: "~/.config/transmission-daemon"
              preserve_if_exists: [settings.json]
        depends: [core.base, desktop.i3]
        start: "Installing media controls"
        end: "Media controls installed"
        type: "Package"
        critical: false

source:
    crush:
        type: "Source"
        build:
            - "$HOME/.local/share/openriot/install/openriot --crush-upgrade"
        depends: []
        start: "Installing/upgrading Crush AI CLI"
        end: "crush installed"
    bibata-cursor:
        type: "Source"
        build:
            - "$HOME/.local/share/openriot/install/openriot --install-asset bibata"
        depends: []
        start: "Installing Bibata-Modern-Ice cursor theme"
        end: "Bibata cursor installed"
    kora:
        type: "Source"
        build:
            - "$HOME/.local/share/openriot/install/openriot --install-asset kora"
        depends: []
        start: "Installing Kora icon theme"
        end: "Kora icon theme installed"
    polybar-scaling:
        type: "Source"
        build:
            - desc: "Scaling polybar for display"
              cmd: |
                  if [ -z "$DISPLAY" ]; then
                      echo "[SKIP] No X11, skipping polybar"
                  else
                      $HOME/.local/share/openriot/install/openriot --polybar-setup
                  fi
            - desc: "Scaling dunst for display"
              cmd: |
                  if [ -z "$DISPLAY" ]; then
                      echo "[SKIP] No X11, skipping dunst"
                  else
                      $HOME/.local/share/openriot/install/openriot --dunst-setup
                  fi
            - desc: "Restarting dunst with new config"
              cmd: |
                  if [ -z "$DISPLAY" ]; then
                      echo "[SKIP] No X11, skipping dunst restart"
                  else
                      pkill -9 dunst 2>/dev/null || true
                      echo "[DONE] Dunst restarted with new config"
                  fi
        depends: []
        start: "Scaling polybar and dunst configs for display"
        end: "Polybar and dunst scaled"
fonts:
    all:
        type: "Source"
        build:
            - "$HOME/.local/share/openriot/install/openriot --install-fonts"
        depends: []
        start: "Installing Nerd Fonts"
        end: "Nerd Fonts installed"
    gurk-keybindings:
        type: "Source"
        build:
            - "$HOME/.local/share/openriot/install/openriot --gurk-setup"
        depends: []
        start: "Configuring gurk keybindings"
        end: "gurk keybindings configured"

system:
    tools:
        packages:
            - rclone-1.73.5
            - wireguard-tools-1.0.20210914p3v0
            - sysbench-0.4.8p17
        depends: [core.base]
        start: "Installing system tools"
        end: "System tools installed"
        type: "Package"
        critical: true
    mac-spoof:
        type: "Source"
        build:
            - "$HOME/.local/share/openriot/install/openriot --random-mac enable"
        depends: [core.base]
        start: "Configuring MAC address randomization"
        end: "MAC randomization configured"
    services:
        type: "Package"
        commands:
            - desc: "Enable apmd (high performance)"
              cmd: "doas rcctl enable apmd && doas rcctl set apmd flags -H"
            - desc: "Disable USB power saving"
              cmd: |
                  if grep -q '^hw.allowpowerdown=' /etc/sysctl.conf 2>/dev/null; then
                      doas sed -i '/^hw.allowpowerdown=/d' /etc/sysctl.conf
                  fi
                  echo 'hw.allowpowerdown=0' | doas tee -a /etc/sysctl.conf >/dev/null
            - desc: "Disable core dumps via login.conf"
              cmd: "doas grep -q ':coredump=0:' /etc/login.conf || doas sed -i 's/:umask=022:/:umask=022: coredump=0:/' /etc/login.conf; doas cap_mkdb /etc/login.conf"
            - desc: "Enable sndiod (audio)"
              cmd: "doas rcctl enable sndiod"
            - desc: "Enable xenodm (X11 display manager)"
              cmd: "rcctl check xenodm >/dev/null 2>&1 || doas rcctl enable xenodm"
            #- desc: "Enable and start seatd (seat management)"
            #  cmd: "doas rcctl enable seatd && doas rcctl start seatd"
            - desc: "Create WireGuard config directory"
              cmd: "doas mkdir -p /etc/wireguard && doas chmod 700 /etc/wireguard"
            - desc: "Update firmware (may take several minutes)"
              cmd: "doas fw_update -a"
            # - desc: "Install Atheros AR9271 WiFi firmware (if adapter present)"
            #  cmd: "if [ -d /etc/firmware ] && ! [ -f /etc/firmware/athn-open-ar9271 ]; then fw_update -v athn 2>/dev/null || (cd /etc/firmware && ftp -o athn-ucode.tgz https://firmware.openbsd.org/firmware/$(uname -r)/athn-ucode.tgz 2>/dev/null && tar -xzf athn-ucode.tgz && rm -f athn-ucode.tgz); fi"
        depends: [core.base]
        start: "Configuring system services"
        end: "System services configured"
    i3-restart:
        type: "Source"
        build:
            - desc: "Restarting i3 window manager"
              cmd: |
                  if [ -z "$DISPLAY" ]; then
                      echo "[SKIP] Not in X11, skipping i3 restart"
                  else
                      i3-msg restart
                  fi
        depends: [desktop.i3, source.polybar-scaling]
        start: "Restarting i3 window manager"
        end: "i3 restarted"

    cleanup:
        type: "Source"
        build:
            - desc: "Killing polybar before exit"
              cmd: |
                  if [ -z "$DISPLAY" ]; then
                      echo "[SKIP] No X11, skipping polybar kill"
                  else
                      pkill -9 polybar 2>/dev/null || true
                      echo "[DONE] Polybar killed (will restart automatically)"
                  fi
        depends: [system.i3-restart]
        start: "Cleaning up stale menus..."
        end: "Cleanup complete. Polybar restarting..."
