# =============================================================================
# OpenRiot i3 Keybindings — OpenBSD X11
# =============================================================================

# SUPER key bindings (Mod4 = Windows key)
# OpenBSD X11 supports Mod4 via XKB — wskbd issues are Wayland-only

bindsym $mod+Return exec $terminal
bindsym $mod+Shift+Return exec $terminal --class=floating_foot
bindsym $mod+Shift+Enter exec alacritty --class=floating_center
bindsym $mod+D exec $menu
bindsym $mod+F exec $fileManager
bindsym $mod+B exec $browser
bindsym $mod+T exec $terminal -e btop
bindsym $mod+O exec $editor
bindsym $mod+G exec Telegram
bindsym $mod+C exec $terminal crush

# =============================================================================
# WINDOW MANAGEMENT
# =============================================================================

bindsym $mod+Q kill
bindsym $mod+Z floating toggle
bindsym $mod+H split horizontal
bindsym $mod+Shift+F fullscreen toggle
bindsym $mod+P layout toggle stacked tabbed split

# =============================================================================
# CLIPBOARD
# =============================================================================

bindsym $mod+Shift+V exec clipmenu

# =============================================================================
# WINDOW SWITCHING
# =============================================================================

bindsym $mod+Tab focus next
bindsym $mod+Shift+Tab focus prev

# =============================================================================
# FOCUS MOVEMENT
# =============================================================================

bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down

# =============================================================================
# WORKSPACE SWITCHING
# =============================================================================

bindsym $mod+1 exec --no-startup-id ~/.local/share/openriot/install/openriot --workspace-switch 1
bindsym $mod+2 exec --no-startup-id ~/.local/share/openriot/install/openriot --workspace-switch 2
bindsym $mod+3 exec --no-startup-id ~/.local/share/openriot/install/openriot --workspace-switch 3
bindsym $mod+4 exec --no-startup-id ~/.local/share/openriot/install/openriot --workspace-switch 4

# =============================================================================
# MOVE WINDOW TO WORKSPACE
# =============================================================================

bindsym $mod+Shift+1 move container to workspace 1; exec --no-startup-id ~/.local/share/openriot/install/openriot --workspace-switch 1
bindsym $mod+Shift+2 move container to workspace 2; exec --no-startup-id ~/.local/share/openriot/install/openriot --workspace-switch 2
bindsym $mod+Shift+3 move container to workspace 3; exec --no-startup-id ~/.local/share/openriot/install/openriot --workspace-switch 3
bindsym $mod+Shift+4 move container to workspace 4; exec --no-startup-id ~/.local/share/openriot/install/openriot --workspace-switch 4

# =============================================================================
# MOVE WINDOWS
# =============================================================================

bindsym $mod+Ctrl+Left move left
bindsym $mod+Ctrl+Right move right
bindsym $mod+Ctrl+Up move up
bindsym $mod+Ctrl+Down move down

# =============================================================================
# CALCULATOR
# =============================================================================

bindsym $mod+equal exec rofi -show calc -modi calc -no-show-match -no-sort

# =============================================================================
# RESIZE WINDOWS
# =============================================================================

bindsym $mod+bracketright resize grow width 10px
bindsym $mod+bracketleft resize shrink width 10px
bindsym $mod+Shift+bracketright resize grow height 10px
bindsym $mod+Shift+bracketleft resize shrink height 10px

# =============================================================================
# SCRATCHPAD
# =============================================================================

bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

# =============================================================================
# MOUSE BINDINGS
# =============================================================================

# Note: Use Super+Z to float window, then drag floating windows
bindsym $mod+button4 workspace prev
bindsym $mod+button5 workspace next

# =============================================================================
# MEDIA KEYS (Volume)
# =============================================================================

bindsym XF86AudioRaiseVolume exec $HOME/.local/share/openriot/install/openriot --volume inc
bindsym XF86AudioLowerVolume exec $HOME/.local/share/openriot/install/openriot --volume dec
bindsym XF86AudioMute exec $HOME/.local/share/openriot/install/openriot --volume toggle
bindsym XF86AudioMicMute exec $HOME/.local/share/openriot/install/openriot --volume mic-toggle

# =============================================================================
# MEDIA KEYS (Brightness)
# =============================================================================

bindsym XF86MonBrightnessUp exec $HOME/.local/share/openriot/install/openriot --brightness up
bindsym XF86MonBrightnessDown exec $HOME/.local/share/openriot/install/openriot --brightness down

# =============================================================================
# SCREENSHOTS (scrot + xclip to ~/Screenshots)
# =============================================================================

bindsym --release Print exec scrot -s -e 'mkdir -p ~/Screenshots && mv $f ~/Screenshots/ && xclip -selection clipboard -t image/png -i ~/Screenshots/$f'
bindsym --release Shift+Print exec scrot -e 'mkdir -p ~/Screenshots && mv $f ~/Screenshots/ && xclip -selection clipboard -t image/png -i ~/Screenshots/$f'
bindsym --release Ctrl+Print exec scrot -e 'mkdir -p ~/Screenshots && mv $f ~/Screenshots/ && xclip -selection clipboard -t image/png -i ~/Screenshots/$f'
bindsym $mod+Shift+S exec scrot -s -e 'mkdir -p ~/Screenshots && mv $f ~/Screenshots/ && xclip -selection clipboard -t image/png -i ~/Screenshots/$f'
bindsym $mod+Print exec scrot -e 'mkdir -p ~/Screenshots && mv $f ~/Screenshots/ && xclip -selection clipboard -t image/png -i ~/Screenshots/$f'

# =============================================================================
# WEB APP BINDINGS
# =============================================================================

bindsym $mod+E exec $HOME/.local/share/openriot/config/bin/firefox-wrapper.sh --notify "Proton Mail" "Opening Proton Mail..." "https://mail.proton.me/u/11/inbox"
bindsym $mod+M exec $browser --app="https://messages.google.com/web/conversations"
bindsym $mod+X exec $HOME/.local/share/openriot/config/bin/firefox-wrapper.sh --notify "X (Twitter)" "Opening X..." "https://x.com/"
bindsym $mod+Shift+X exec $browser --app="https://x.com/compose/post"
bindsym $mod+K exec $browser --app="https://keep.google.com/"

# =============================================================================
# LOCK & POWER
# =============================================================================

bindsym $mod+L exec $HOME/.local/share/openriot/config/bin/openriot-lock.sh
bindsym $mod+Escape exec $HOME/.local/share/openriot/install/openriot --power-menu
bindsym $mod+W exec $HOME/.local/share/openriot/install/openriot --wallpaper-next

# =============================================================================
# POLYBAR REFRESH
# =============================================================================

bindsym $mod+Shift+space exec polybar-msg cmd restart

# =============================================================================
# RELOAD & EXIT
# =============================================================================

bindsym $mod+Shift+C reload
bindsym $mod+Shift+R restart

# =============================================================================
# EXIT
# =============================================================================

bindsym $mod+Shift+E exec "i3-nagbar -t warning -m 'Exit i3?' -b 'Yes' 'i3-msg exit'"

# =============================================================================
# HELP
# =============================================================================

bindsym $mod+Shift+H exec $browser --app="https://openriot.org"
