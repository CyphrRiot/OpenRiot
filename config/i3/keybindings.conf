# =============================================================================
# OpenRiot i3 Keybindings — OpenBSD X11
# =============================================================================

# SUPER key bindings (Mod4 = Windows key)
# OpenBSD X11 supports Mod4 via XKB — wskbd issues are Wayland-only

bindsym $mod+Return exec $terminal
bindsym $mod+Shift+Return exec $terminal --class=floating_center
bindsym $mod+Shift+Enter exec alacritty --class=floating_center
bindsym $mod+D exec $openriot_bin --rofi
bindsym $mod+F exec $fileManager
bindsym $mod+B exec $browser
bindsym $mod+T exec $terminal -e btop
bindsym $mod+O exec $editor
bindsym $mod+G exec Telegram
bindsym $mod+C exec $openriot_bin --crush
bindsym $mod+S exec $openriot_bin --signal-launch

# =============================================================================
# WINDOW MANAGEMENT
# =============================================================================

bindsym $mod+Q kill
bindsym $mod+Z floating toggle
bindsym $mod+H split horizontal
bindsym $mod+Shift+F fullscreen toggle
bindsym $mod+P layout toggle stacked tabbed split

# =============================================================================
# CLIPBOARD
# =============================================================================

bindsym $mod+Shift+V exec clipmenu

# =============================================================================
# WINDOW SWITCHING
# =============================================================================

bindsym $mod+Tab focus next
bindsym $mod+Shift+Tab focus prev

# =============================================================================
# FOCUS MOVEMENT
# =============================================================================

bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down

# =============================================================================
# WORKSPACE SWITCHING
# =============================================================================

bindsym $mod+1 exec --no-startup-id $openriot_bin --workspace-switch 1
bindsym $mod+2 exec --no-startup-id $openriot_bin --workspace-switch 2
bindsym $mod+3 exec --no-startup-id $openriot_bin --workspace-switch 3
bindsym $mod+4 exec --no-startup-id $openriot_bin --workspace-switch 4

# =============================================================================
# MOVE WINDOW TO WORKSPACE
# =============================================================================

bindsym $mod+Shift+1 move container to workspace 1; exec --no-startup-id $openriot_bin --workspace-switch 1
bindsym $mod+Shift+2 move container to workspace 2; exec --no-startup-id $openriot_bin --workspace-switch 2
bindsym $mod+Shift+3 move container to workspace 3; exec --no-startup-id $openriot_bin --workspace-switch 3
bindsym $mod+Shift+4 move container to workspace 4; exec --no-startup-id $openriot_bin --workspace-switch 4

# =============================================================================
# MOVE WINDOWS
# =============================================================================

bindsym $mod+Ctrl+Left move left
bindsym $mod+Ctrl+Right move right
bindsym $mod+Ctrl+Up move up
bindsym $mod+Ctrl+Down move down

# =============================================================================
# CALCULATOR
# =============================================================================

bindsym $mod+equal exec rofi -show calc -modi calc -no-show-match -no-sort

# =============================================================================
# RESIZE WINDOWS
# =============================================================================

bindsym $mod+bracketright resize grow width 10px
bindsym $mod+bracketleft resize shrink width 10px
bindsym $mod+Shift+bracketright resize grow height 10px
bindsym $mod+Shift+bracketleft resize shrink height 10px

# =============================================================================
# SCRATCHPAD
# =============================================================================

bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

# =============================================================================
# MOUSE BINDINGS
# =============================================================================

# Note: Use Super+Z to float window, then drag floating windows
bindsym $mod+button4 workspace prev
bindsym $mod+button5 workspace next

# =============================================================================
# MEDIA KEYS (Volume)
# =============================================================================

bindsym XF86AudioRaiseVolume exec $openriot_bin --volume inc
bindsym XF86AudioLowerVolume exec $openriot_bin --volume dec
bindsym XF86AudioMute exec $openriot_bin --volume toggle
bindsym XF86AudioMicMute exec $openriot_bin --volume mic-toggle

# =============================================================================
# MEDIA KEYS (Brightness)
# =============================================================================

bindsym XF86MonBrightnessUp exec $openriot_bin --brightness up
bindsym XF86MonBrightnessDown exec $openriot_bin --brightness down

# =============================================================================
# SCREENSHOTS (maim via openriot)
# =============================================================================

bindsym --release Print exec $openriot_bin --screenshot
bindsym --release Shift+Print exec $openriot_bin --screenshot
bindsym --release Ctrl+Print exec $openriot_bin --screenshot
bindsym $mod+Shift+S exec $openriot_bin --screenshot select
bindsym $mod+Print exec $openriot_bin --screenshot

# =============================================================================
# WEB APP BINDINGS
# =============================================================================

bindsym $mod+E exec $openriot_bin --proton
bindsym $mod+M exec $browser --app="https://messages.google.com/web/conversations"
bindsym $mod+X exec $openriot_bin --twitter
bindsym $mod+Shift+X exec $browser --app="https://x.com/compose/post"
bindsym $mod+K exec $browser --app="https://keep.google.com/"

# =============================================================================
# LOCK & POWER
# =============================================================================

bindsym $mod+L exec $openriot_bin --lock
bindsym $mod+Escape exec $openriot_bin --power-menu
bindsym $mod+W exec $openriot_bin --wallpaper-next

# =============================================================================
# POLYBAR MODULE HOTKEYS
# =============================================================================

bindsym $mod+N exec $openriot_bin --night-light
bindsym $mod+V exec $openriot_bin --volume toggle
bindsym $mod+U exec $openriot_bin --update
bindsym $mod+Y exec $openriot_bin --crypto-notify
bindsym $mod+A exec $openriot_bin --battery-notify
bindsym $mod+I exec $openriot_bin --wireguard
bindsym $mod+J exec $openriot_bin --proton-drive-sync
bindsym $mod+Shift+P exec $openriot_bin --cpu-notify
bindsym $mod+Shift+M exec $openriot_bin --mem-notify
bindsym $mod+Shift+N exec $openriot_bin --wifi-info

# =============================================================================
# POLYBAR REFRESH
# =============================================================================

bindsym $mod+Shift+space exec polybar-msg cmd restart

# =============================================================================
# RELOAD & EXIT
# =============================================================================

bindsym $mod+Shift+C reload
bindsym $mod+Shift+R restart

# =============================================================================
# EXIT
# =============================================================================

bindsym $mod+Shift+E exec "i3-nagbar -t warning -m 'Exit i3?' -b 'Yes' 'i3-msg exit'"

# =============================================================================
# HELP
# =============================================================================

bindsym $mod+Shift+H exec $browser --app="https://openriot.org"
