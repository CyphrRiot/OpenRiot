# OpenRiot Picom Config
# X11 compositor with rounded corners

# Daemon mode
daemon = true;

# Backend
backend = "glx";
use-damage = false;
vsync = false;
unredir-if-possible = true;

# Rounded corners
corner-radius = 8;
detect-rounded-corners = false;

# Client-side decorations fix: exclude apps with CSD (title bars drawn by app)
# Disable everything for CSD apps - picom clips their custom borders wrong
round-borders-exclude = [
  "class_g = 'gnome-text-editor'",
  "class_g = 'Gedit'",
  "class_g = 'polybar'"
];

# Drag and drop
drag-and-drop = true;

# Fading
fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 10;
