# OpenRiot Picom Config
# X11 compositor with rounded corners

# Daemon mode
daemon = true;

# Backend
backend = "glx";

# Rounded corners
corner-radius = 8;
detect-rounded-corners = true;

# Shadows
shadow = true;
shadow-radius = 8;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.25;

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 10;
