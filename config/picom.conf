# OpenRiot Picom Config
# X11 compositor with rounded corners

# Daemon mode
daemon = true;

# Backend
backend = "glx";

# Rounded corners
corner-radius = 8;
detect-rounded-corners = true;

# Client-side decorations fix: exclude apps with CSD (title bars drawn by app)
# Disable everything for CSD apps - picom clips their custom borders wrong
round-borders-exclude = [
  "class_g = 'gnome-text-editor'",
  "class_g = 'Gedit'"
];
shadow-exclude = [
  "class_g = 'gnome-text-editor'",
  "class_g = 'Gedit'"
];
blur-background-exclude = [
  "class_g = 'gnome-text-editor'",
  "class_g = 'Gedit'"
];
dim-exclude = [
  "class_g = 'gnome-text-editor'"
];
fade-exclude = [
  "class_g = 'gnome-text-editor'"
];

# Shadows
shadow = true;
shadow-radius = 8;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.25;

# Drag and drop
drag-and-drop = true;

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 10;
