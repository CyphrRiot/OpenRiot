# -*- conf -*-

# OpenRiot foot terminal config
# Tokyo Night theme with Nerd Fonts + Paper Mono

# shell=$SHELL
# term=foot
# login-shell=no

app-id=openriot
title=openriot
# locked-title=no

# Font: FiraCode Nerd Font (text + symbols in one font)
font=FiraCode Nerd Font:size=12
# font-bold=<bold variant of regular font>
# font-italic=<italic variant of regular font>
# font-bold-italic=<bold+italic variant of regular font>
# font-size-adjustment=0.5
# line-height=<font metrics>
# letter-spacing=0
# horizontal-letter-offset=0
# vertical-letter-offset=0
# underline-offset=<font metrics>
# underline-thickness=<font underline thickness>
# strikeout-thickness=<font strikeout thickness>
# box-drawings-uses-font-glyphs=no
# dpi-aware=no
# gamma-correct-blending=no

initial-color-theme=dark
initial-window-size-pixels=900x600
initial-window-mode=windowed
pad=0x0 center-when-maximized-and-fullscreen
# resize-by-cells=yes
# resize-keep-grid=yes
# resize-delay-ms=100

# bold-text-in-bright=no
word-delimiters=,│`|:"'()[]{}<>
selection-target=primary
# workers=<number of logical CPUs>
# utmp-helper=/usr/lib/utempter/utempter
# utmp-helper=/usr/libexec/ulog-helper

# uppercase-regex-insert=yes

[environment]
# name=value

[security]
# osc52=enabled

[bell]
# system=yes
# urgent=no
# notify=no
# visual=no
# command=
# command-focused=no

[desktop-notifications]
# command=notify-send --wait --app-name ${app-id} --icon ${app-id} --category ${category} --urgency ${urgency} --expire-time ${expire-time} --hint STRING:image-path:${icon} --hint BOOLEAN:suppress-sound:${muted} --hint STRING:sound-name:${sound-name} --replace-id ${replace-id} ${action-argument} --print-id -- ${title} ${body}
# command-action-argument=--action ${action-name}=${action-label}
# close=""
# inhibit-when-focused=yes


[scrollback]
lines=1000
# multiplier=3.0
# indicator-position=relative
# indicator-format=""

[url]
# launch=xdg-open ${url}
# label-letters=sadfjklewcmpgh
# osc8-underline=url-mode
# regex=(((https?://|mailto:|ftp://|file:|ssh:|ssh://|git://|tel:|magnet:|ipfs://|ipns://|gemini://|gopher://|news:)|www\.)([0-9a-zA-Z:/?#@!$&*+,;=.~_%^\-]+|\([]\["0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]*\)|\[[\(\)"0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]*\]|"[]\[\(\)0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]*"|'[]\[\(\)0-9a-zA-Z:/?#@!$&*+,;=.~_%^\-]*')+([0-9a-zA-Z/#@$&*+=~_%^\-]|\([]\["0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]*\)|\[[\(\)"0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]*\]|"[]\[\(\)0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]*"|'[]\[\(\)0-9a-zA-Z:/?#@!$&*+,;=.~_%^\-]*')+([0-9a-zA-Z/#@$&*+=~_%^\-]|\([]\["0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]*\)|\[[\(\)"0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]*\]|"[]\[\(\)0-9a-zA-Z:/?#@!$&'*+,;=.~_%^\-]*"|'[]\[\(\)0-9a-zA-Z:/?#@!$&*+,;=.~_%^\-]*')

[cursor]
style=block
blink=no
# blink-rate=500
# beam-thickness=1.5
# underline-thickness=<font underline thickness>

[mouse]
hide-when-typing=no
# alternate-scroll-mode=yes

[touch]
# long-press-delay=400

[colors-dark]
alpha=1.0
# alpha-mode=default

# Tokyo Night colors
background=1a1b26
foreground=c0caf5

# cursor=<inverse foreground/background>

## Normal/regular colors (color palette 0-7)
regular0=15161e   # black
regular1=f7768e   # red
regular2=9ece6a   # green
regular3=e0af68   # yellow
regular4=7aa2f7   # blue
regular5=bb9af7   # magenta
regular6=7dcfff   # cyan
regular7=c0caf5   # white

## Bright colors (color palette 8-15)
bright0=414868    # bright black
bright1=f7768e    # bright red
bright2=9ece6a    # bright green
bright3=e0af68    # bright yellow
bright4=7aa2f7    # bright blue
bright5=bb9af7    # bright magenta
bright6=7dcfff    # bright cyan
bright7=ffffff    # bright white

## dimmed colors
# dim0=<not set>
# ...

## The remaining 256-color palette
# 16 = <256-color palette #16>
# ...
# 255 = <256-color palette #255>

## Sixel colors
# sixel0 =  000000
# ...
# sixel15 =  cccccc

## Misc colors
# selection-foreground=<inverse foreground/background>
# selection-background=<inverse foreground/background>
jump-labels=15161e e0af68
scrollback-indicator=15161e 7aa2f7
search-box-no-match=15161e f7768e
search-box-match=15161e e0af68
urls=e0af68

[colors-light]
# Alternative color theme
