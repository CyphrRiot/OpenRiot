# Define the AI language server (lsp-ai with your OpenRouter MiniMax-2.7)
# [language-server.lsp-ai]
# command = "lsp-ai"

# === Rust ===
[[language]]
name = "rust"
language-servers = ["rust-analyzer", "lsp-ai"]

# === Python ===
[[language]]
name = "python"
language-servers = ["pyright", "lsp-ai"]

# === Go ===
[[language]]
name = "go"
roots = ["go.mod", "go.work"]
auto-format = true
indent = { tab-width = 4, unit = "    " }
comment-token = "//"
language-servers = ["gopls", "lsp-ai"]
formatter = { command = "goimports" }
