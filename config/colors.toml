# OpenRiot Color System — Canonical Source
# All Go TUIs, polybar, rofi, and CSS reference this file.
# Change [accent] to cycle the color wheel.

[base]
bg = "#1a1b26"
bg2 = "#24283b"
fg = "#c0caf5"
fg2 = "#a3acc9"
fg3 = "#565f89"
dim = "#3b4261"

[accent]
# Cycle through: green → violet → cyan → blue → orange
# Each accent* key gets the new palette when wheel rotates
name = "bondi-green"
fg = "#9ECE6A"
fg-light = "#8BB85A"
bg = "#2B3A1A"

[semantic]
error = "#F7768E"
warning = "#E0AF68"
success = "#04B575"
info = "#7AA2F7"
cyan = "#0DB9D7"

[compat]
# Legacy names used across codebase — not for new code
green = "#9ECE6A"
violet = "#7D56F4"
blue = "#7AA2F7"
dim-gray = "#565F89"
white = "#FAFAFA"

[extended]
# Polybar / rofi specific colors beyond canonical palette
teal = "#7d8df7"
sky = "#7DCFFF"
electric = "#89B4FA"
purple = "#A78BFA"
violet = "#997DE1"
orange = "#FF9E64"
cyan-dim = "#5a95b8"
launcher-fg = "#9EC8F9"
sep-bg = "#13141C"
bg-dark = "#06070B"
bg-mid = "#0E0F17"
fg-bright = "#E0E6F5"
muted = "#414868"
sec-yellow = "#F4D03F"
sec-orange = "#FF8844"