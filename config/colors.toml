# OpenRiot Color System — Canonical Source
# All Go TUIs, polybar, rofi, and CSS reference this file.
# Change [accent] to cycle the color wheel.

[base]
bg = "#1a1b26"
bg2 = "#24283b"
fg = "#a3acc9"
fg2 = "#8b93ad"
fg3 = "#565f89"
dim = "#3b4261"

[accent]
# Cycle through: green → violet → cyan → blue → orange
# Each accent* key gets the new palette when wheel rotates
name = "bondi-green"
fg = "#9ECE6A"
fg-light = "#8BB85A"
dim = "#6d9a4e"
bg = "#2B3A1A"

[semantic]
error = "#c46a7d"
warning = "#c9b47e"
success = "#04B575"
info = "#6d8fd6"
cyan = "#4d9fae"

[compat]
# Legacy names used across codebase — not for new code
green = "#9ECE6A"
violet = "#7D56F4"
blue = "#6d8fd6"
dim-gray = "#565F89"
white = "#FAFAFA"

[extended]
# Polybar / rofi specific colors beyond canonical palette
teal = "#7d8df7"
sky = "#5a95b8"
electric = "#6d8fd6"
purple = "#997DE1"
violet = "#8b7bc4"
orange = "#d99a6c"
cyan-dim = "#5a95b8"
launcher-fg = "#a3acc9"
sep-bg = "#565f89"
bg-dark = "#06070B"
bg-mid = "#0E0F17"
fg-bright = "#a3acc9"
muted = "#565f89"
sec-yellow = "#c9b47e"
sec-orange = "#d99a6c"
