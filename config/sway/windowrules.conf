# =============================================================================
# Sway Window Rules — OpenRiot (OpenBSD only)
# =============================================================================

# =============================================================================
# FLOATING TERMINAL (havoc --class=floating_havoc)
# =============================================================================

for_window [app_id="^floating_havoc$"] floating enable, resize set 900 600, move position center

# =============================================================================
# HELIX EDITOR — title formatting for waybar
# =============================================================================

for_window [class="^Havoc$" title=".*hx.*"] title_format "Helix"
for_window [class="^Havoc$" title=".*\\.hx$"] title_format "Helix"

# =============================================================================
# CRUSH AI — title formatting for waybar
# =============================================================================

for_window [class="^Havoc$" title=".*crush.*"] title_format "Crush"

# =============================================================================
# FILE MANAGER (lf)
# =============================================================================

for_window [class="^Havoc$" title=".*lf.*"] title_format "lf"

# =============================================================================
# SYSTEM MONITOR (btop)
# =============================================================================

for_window [class="^Havoc$" title=".*btop.*"] title_format "btop"

# =============================================================================
# BROWSER (firefox)
# =============================================================================

# Firefox: default tiling is fine

# =============================================================================
# MESSENGERS (tdesktop, flare-messenger)
# =============================================================================

# tdesktop (Telegram) — keep default tiling

# flare-messenger (Signal) — keep default tiling

# =============================================================================
# MEDIA (transmission)
# =============================================================================

for_window [class="^Transmission$"] floating enable, resize set 800 600, move position center

# =============================================================================
# OPENRIOT DIALOGS
# =============================================================================

for_window [title="^(Welcome to OpenRiot)$"] floating enable, resize set 800 85%, move position center
for_window [title="^(OpenRiot Update Available)$"] floating enable, resize set 35% 65%, move position center
for_window [title="^(OpenRiot Control Panel)$"] floating enable, resize set 900 85%, move position center

# =============================================================================
# POPUP DIALOGS
# =============================================================================

for_window [class="^(xdg-desktop-portal-gtk)$" title="^(Save a File)$"] floating enable
for_window [title="^(.*wants to save.*)$"] floating enable
for_window [title="^(.*wants to open.*)$"] floating enable
