interval = 60
tail = false
format = <label>
format-foreground = ${colors.blue}

format-padding = 0
label = %output%
click-left = $HOME/.local/share/openriot/install/openriot --cpu-notify

[module/memory]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-memory
interval = 60
tail = false
format = <label>
format-foreground = ${colors.blue}

format-padding = 0
label = %output%
