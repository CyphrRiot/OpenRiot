; OpenRiot Polybar Config — Tokyo Night Theme for OpenBSD X11

[colors]
bg = #06070B
bg2 = #0E0F17
fg = #E0E6F5
fg2 = #A3ACC9
fg3 = #565F89
red = #F7768E
orange = #FF9E64
yellow = #E0AF68
green = #9ECE6A
cyan = #0DB9D7
blue = #7AA2F7
sky = #7DCFFF
electric = #89B4FA
purple = #9D7AF5
violet = #997DE1
teal = #7d8df7
intermediate = #8aa2f0
cyan-dim = #5a95b8
muted = #414868

[global/wm]
margin-bottom = 3

[bar/main]
type = xcb
enable-ipc = true
fixed-center = false
width = 100%
height = 26
radius = 0
underline-size = 0
underline-color = ${colors.cyan}
line-size = 0
dpi-x = 96
dpi-y = 96
offset-y = 3
padding-right = 1
padding-left = 0
module-margin = 1
spacing = 0
clickareas = 64


; Fonts
font-0 = "Hurmit Nerd Font:size=11"
font-1 = "Hurmit Nerd Font:size=18"

; Separator style
separator = ""
separator-padding = 0

; Modules layout: i3 workspaces | arrow | date | arrow | volume | network | battery | arrow | power
modules-left = launcher all
modules-center = weather date
modules-right = crypto transmission nzbget proton-drive night-light sep cpu memory sep wireguard stealth network-wifi network-eth openriot-update sep hdmi volume battery sep screenrec settings power lock

; Colors
background = ${colors.bg}
foreground = ${colors.fg}
line-color = ${colors.cyan}

; ========================
; MODULES
; ========================


[module/all]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-all
interval = 3
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 0
label = %output%

[module/launcher]
type = custom/text
format = "%{T1} 󰀻%{T-}"
format-foreground = ${colors.purple}

format-padding = 0
click-left = $HOME/.local/share/openriot/install/openriot --rofi

[module/sep]
type = custom/text
format = "·"
content-foreground = #13141C

[module/date]
type = internal/date
interval = 60
format = <label>
format-foreground = ${colors.fg2}
format-offset = 0
format-padding = 0
date = "%A • %B %d • %I:%M %p"
label = %date%
click-left = $HOME/.local/share/openriot/install/openriot --wallpaper-next

[module/volume]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-volume
exec-click = true
interval = 31
tail = false
format = <label>
format-foreground = ${colors.cyan}

format-padding = 0
label = %output%
click-left = $HOME/.local/share/openriot/install/openriot --volume toggle
scroll-up = $HOME/.local/share/openriot/install/openriot --volume inc
scroll-down = $HOME/.local/share/openriot/install/openriot --volume dec

[module/network-wifi]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --network-wifi
interval = 60
tail = false
format = <label>
format-foreground = ${colors.sky}

format-padding = 0
label = %output%
label-empty =
click-left = $HOME/.local/share/openriot/install/openriot --wifi-click

[module/network-eth]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --network-eth
interval = 33
tail = false
format = <label>
format-foreground = ${colors.sky}

format-padding = 0
label = %output%
click-left = $HOME/.local/share/openriot/install/openriot --eth-info

[module/battery]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --battery
interval = 32
tail = false
format = <label>
format-foreground = ${colors.cyan}

format-padding = 0
label = %output%
label-empty =
click-left = $HOME/.local/share/openriot/install/openriot --battery-notify

[module/settings]
type = custom/text
format = "%{T1}%{T-}%{O2}"
format-foreground = ${colors.purple}

format-padding = 0
click-left = $HOME/.local/share/openriot/install/openriot --settings-menu

[module/openriot-update]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --update-status
interval = 3600
tail = false
format = <label>
format-foreground = ${colors.sky}

format-padding = 0
label = %output%
click-left = $HOME/.local/share/openriot/install/openriot --update

[module/hdmi]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --hdmi
interval = 65
tail = false
format = <label>
format-foreground = ${colors.cyan}

format-padding = 0
label = %output%
label-empty =
click-left = $HOME/.local/share/openriot/install/openriot --hdmi-toggle

[module/weather]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --weather
interval = 1800
tail = false
format = <label>
format-foreground = ${colors.fg3}
format-offset = 0
format-padding = 0
label = %output%
label-empty =

[module/proton-drive]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-proton-drive
interval = 60
tail = false
format = <label>
format-foreground = ${colors.teal}

format-padding = 0
label = %output%
label-empty =
click-left = $HOME/.local/share/openriot/install/openriot --proton-drive-sync

[module/transmission]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-transmission
interval = 60
tail = false
format = <label>
format-foreground = ${colors.teal}

format-padding = 0
label = %output%
label-empty =
click-left = $HOME/.local/share/openriot/install/openriot --transmission-notify

[module/crypto]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --crypto-icon
interval = 60
format = <label>
format-foreground = ${colors.teal}

format-padding = 0
label = %output%
label-empty =
click-left = $HOME/.local/share/openriot/install/openriot --crypto-notify

[module/nzbget]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-nzbget
interval = 30
tail = false
format = <label>
format-foreground = ${colors.teal}

format-padding = 0
label = %output%
label-empty =
click-left = $HOME/.local/share/openriot/install/openriot --nzbget-open

[module/night-light]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --night-light-status
interval = 60
tail = false
format = <label>
format-foreground = ${colors.teal}

format-padding = 0
label = %output%
label-empty =
click-left = $HOME/.local/share/openriot/install/openriot --night-light

[module/screenrec]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --screenrec-status
interval = 2
tail = false
format = <label>
format-foreground = ${colors.purple}

format-padding = 0
label = %output%
label-empty =
click-left = $HOME/.local/share/openriot/install/openriot --screenrec-toggle

[module/wireguard]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --wireguard-status
interval = 60
tail = false
format = <label>
format-foreground = ${colors.sky}

format-padding = 0
label = %output%
label-empty =
click-left = $HOME/.local/share/openriot/install/openriot --wireguard-notify

[module/stealth]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --stealth-status
interval = 60
tail = false
format = <label>
format-foreground = ${colors.sky}

format-padding = 0
label = %output%
click-left = $HOME/.local/share/openriot/install/openriot --stealth-notify

[module/cpu]
