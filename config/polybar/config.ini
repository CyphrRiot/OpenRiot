; OpenRiot Polybar Config — Tokyo Night Theme for OpenBSD X11

[colors]
bg = #1a0a3d
bg2 = #1a0a3d
fg = #c0caf5
fg2 = #a9b1d6
fg3 = #565f89
red = #f7768e
orange = #ff9e64
yellow = #e0af68
green = #9ece6a
cyan = #7dcfff
blue = #7aa2f7
purple = #bb9af7
light-purple = #9d7cd8
dark-purple = #4c1d95
darker-purple = #6c2bd9
violet = #bb9af7
disabled = #414868
separator = #414868

[global/wm]
margin-bottom = 5

[bar/main]
type = xcb
enable-ipc = true
fixed-center = false
width = 100%
height = 26
radius = 0
underline-size = 2
line-size = 2
padding-right = 3
padding-left = 0
padding-top = 4
padding-bottom = 2
module-margin = 1
spacing = 0

; Fonts
font-0 = "FiraCode Nerd Font:size=11"
font-1 = "FiraCode Nerd Font:size=15"
font-2 = "Paper Mono:style=Regular:size=8"

; Separator style
separator = ""
separator-padding = 0

; Modules layout: i3 workspaces | arrow | date | arrow | volume | network | battery | arrow | power
modules-left = launcher workspaces workspaces2 workspaces3 workspaces4 window-title
modules-center = date weather
modules-right = proton-drive transmission crypto night-light cpu memory volume wireguard network-wifi network-eth openriot-update battery power lock

; Colors
background = ${colors.bg}
foreground = ${colors.fg}
line-color = ${colors.fg}

; ========================
; MODULES
; ========================

[module/workspaces]
type = custom/script
exec = $HOME/.local/share/openriot/config/polybar/scripts/workspaces.sh 1
interval = 2
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 0
label = %output%
click-left = $HOME/.local/share/openriot/install/openriot --workspace-switch 1

[module/workspaces2]
type = custom/script
exec = $HOME/.local/share/openriot/config/polybar/scripts/workspaces.sh 2
interval = 2
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 0
label = %output%
click-left = $HOME/.local/share/openriot/install/openriot --workspace-switch 2

[module/workspaces3]
type = custom/script
exec = $HOME/.local/share/openriot/config/polybar/scripts/workspaces.sh 3
interval = 2
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 0
label = %output%
click-left = $HOME/.local/share/openriot/install/openriot --workspace-switch 3

[module/workspaces4]
type = custom/script
exec = $HOME/.local/share/openriot/config/polybar/scripts/workspaces.sh 4
interval = 2
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 3
label = %output%
click-left = $HOME/.local/share/openriot/install/openriot --workspace-switch 4

[module/i3]
type = internal/i3
pin-workspaces = false
strip-wsnumbers = false

[module/launcher]
type = custom/text
format = "%{T2} %{T-}"
format-foreground = ${colors.fg}
format-padding = 0
click-left = $HOME/.local/share/openriot/install/openriot --rofi
tooltip = App Launcher

label-mode = %mode%
label-mode-foreground = ${colors.fg}

label-focused = 󰟠
label-focused-foreground = ${colors.fg}
label-focused-padding = 2

label-unfocused = 󰊉
label-unfocused-foreground = ${colors.fg2}
label-unfocused-padding = 2

label-visible = 󰊉
label-visible-foreground = ${colors.fg2}
label-visible-padding = 2

label-urgent = 󰨏
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 3

label-separator = ""
label-separator-padding = 0

[module/arrow-left]
type = custom/text
content = " %{T1}%{T-}"
content-font = 1
content-foreground = ${colors.dark-purple}
content-background = ${colors.bg}

[module/arrow-right]
type = custom/text
content = "%{T1} %{T-} "
content-font = 1
content-foreground = ${colors.dark-purple}
content-background = ${colors.bg}

[module/date]
type = internal/date
interval = 1
format = <label>
format-foreground = ${colors.fg}
format-padding = 0
date = "%A • %B %d • %I:%M %p"
click-left = $HOME/.local/share/openriot/install/openriot --wallpaper-next

[module/volume]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-volume
exec-click = true
interval = 10
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 1
label = %output%
tooltip = Volume: scroll to adjust
click-left = $HOME/.local/share/openriot/install/openriot --volume toggle
scroll-up = $HOME/.local/share/openriot/install/openriot --volume inc
scroll-down = $HOME/.local/share/openriot/install/openriot --volume dec

[module/network-wifi]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --network-wifi
interval = 30
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 1
label = %output%
tooltip = WiFi Status
click-left = $HOME/.local/share/openriot/install/openriot --wifi-info

[module/network-eth]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --network-eth
interval = 30
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 1
label = %output%
tooltip = Ethernet Status
click-left = $HOME/.local/share/openriot/install/openriot --eth-info

[module/battery]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --battery
interval = 30
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 1
label = %output%
label-empty =
tooltip = Battery status
click-left = $HOME/.local/share/openriot/install/openriot --battery-notify

[module/openriot-update]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --update-status
interval = 3600
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 1
label = %output%
tooltip = OpenRiot update available
click-left = $HOME/.local/share/openriot/install/openriot --update

[module/weather]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --weather
interval = 1800
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 1
label = %output%
label-empty =
tooltip = Weather

[module/proton-drive]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-proton-drive
interval = 60
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 1
label = %output%
click-left = $HOME/.local/share/openriot/install/openriot --proton-drive-sync

[module/transmission]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-transmission
interval = 15
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 1
label = %output%
click-left = $HOME/.local/share/openriot/install/openriot --transmission-toggle
tooltip = Toggle Transmission

[module/crypto]
type = custom/text
format = "%{T1}%{T-}"
format-foreground = ${colors.fg}
format-padding = 1
click-left = $HOME/.local/share/openriot/install/openriot --crypto-notify
tooltip = Crypto prices

[module/night-light]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --night-light-status
interval = 300
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 1
label = %output%
click-left = $HOME/.local/share/openriot/install/openriot --night-light
tooltip = Toggle Night Light

[module/wireguard]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --wireguard-status
interval = 10
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 1
label = %output%
click-left = $HOME/.local/share/openriot/install/openriot --wireguard
tooltip = Toggle WireGuard VPN

[module/cpu]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-metrics
interval = 60
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 1
label = %output%
tooltip = CPU usage
click-left = $HOME/.local/share/openriot/install/openriot --cpu-notify

[module/memory]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-memory
interval = 60
tail = false
format = <label>
format-foreground = ${colors.fg}
format-padding = 1
label = %output%
tooltip = Memory usage
click-left = $HOME/.local/share/openriot/install/openriot --mem-notify

[module/power]
type = custom/text
format = ⏻
format-foreground = ${colors.fg}
format-padding = 1
click-left = $HOME/.local/share/openriot/install/openriot --power-menu
tooltip = Power menu

[module/lock]
type = custom/text
format = 󰌾
format-foreground = ${colors.fg}
format-padding = 1
click-left = $HOME/.local/share/openriot/install/openriot --lock

[module/window-title]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --window-title
interval = 2
tail = false
format = <label>
format-foreground = ${colors.fg3}
format-padding = 0
label = %output%
label-empty =
