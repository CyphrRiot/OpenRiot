; OpenRiot Polybar Config — Tokyo Night Theme for OpenBSD X11

[colors]
bg = #0A0B1E
bg2 = #1A1B2E
fg = #c0caf5
fg2 = #a9b1d6
fg3 = #565f89
red = #f7768e
orange = #ff9e64
yellow = #e0af68
green = #9ece6a
cyan = #7dcfff
blue = #7aa2f7
purple = #7dcfff
light-purple = #7aa2f7
dark-purple = #1e3a8a
darker-purple = #2563eb
violet = #bb9af7
teal = #73daca
disabled = #414868
separator = #414868

[global/wm]
margin-bottom = 3

[bar/main]
type = xcb
enable-ipc = true
fixed-center = true
width = 100%
height = 26
radius = 8
underline-size = 2
underline-color = ${colors.cyan}
line-size = 0
dpi-x = 96
dpi-y = 96
offset-y = 3
padding-right = 3
padding-left = 0
module-margin = 1
spacing = 0
clickareas = 32


; Fonts
font-0 = "Hurmit Nerd Font:size=11"
font-1 = "Hurmit Nerd Font:size=20"

; Separator style
separator = ""
separator-padding = 0

; Modules layout: i3 workspaces | arrow | date | arrow | volume | network | battery | arrow | power
modules-left = launcher workspaces window-title
modules-center = weather date
modules-right = crypto proton-drive transmission night-light sep cpu memory sep wireguard stealth network-wifi network-eth sep openriot-update settings sep laptop-monitor volume battery power lock

; Colors
background = ${colors.bg}
foreground = ${colors.fg}
line-color = ${colors.cyan}

; ========================
; MODULES
; ========================

[module/workspaces]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --workspace-icons-all
interval = 2
tail = false
format = <label>
format-foreground = ${colors.fg}
format-offset = 2
format-padding = 0
label = %output%
tooltip = Click workspace to switch

[module/i3]
type = internal/i3
pin-workspaces = false
strip-wsnumbers = false

[module/launcher]
type = custom/text
format = "%{T1} %{T-}"
format-foreground = ${colors.violet}
format-offset = 2
format-padding = 0
click-left = $HOME/.local/share/openriot/install/openriot --rofi
tooltip = App Launcher

label-mode = %mode%
label-mode-foreground = ${colors.fg}

label-focused = 
label-focused-foreground = ${colors.fg}
label-focused-padding = 2

label-unfocused = 󰊉
label-unfocused-foreground = ${colors.fg2}
label-unfocused-padding = 2

label-visible = 󰊉
label-visible-foreground = ${colors.fg2}
label-visible-padding = 2

label-urgent = 󰨏
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 3

label-separator = ""
label-separator-padding = 0

[module/sep]
type = custom/text
content = "|"
content-foreground = ${colors.fg3}

[module/date]
type = internal/date
interval = 1
format = <label>
format-foreground = ${colors.blue}
format-offset = 0
format-padding = 0
date = "%A • %B %d • %I:%M %p"
label = %date%
click-left = $HOME/.local/share/openriot/install/openriot --wallpaper-next

[module/volume]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-volume
exec-click = true
interval = 10
tail = false
format = <label>
format-foreground = ${colors.fg2}
format-offset = 2
format-padding = 0
label = %output%
tooltip = Volume: scroll to adjust
click-left = $HOME/.local/share/openriot/install/openriot --volume toggle
scroll-up = $HOME/.local/share/openriot/install/openriot --volume inc
scroll-down = $HOME/.local/share/openriot/install/openriot --volume dec

[module/network-wifi]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --network-wifi
interval = 60
tail = false
format = <label>
format-foreground = ${colors.cyan}
format-offset = 2
format-padding = 0
label = %output%
label-empty =
tooltip = WiFi Status
click-left = $HOME/.local/share/openriot/install/openriot --wifi-reconnect

[module/network-eth]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --network-eth
interval = 30
tail = false
format = <label>
format-foreground = ${colors.cyan}
format-offset = 2
format-padding = 0
label = %output%
tooltip = Ethernet Status
click-left = $HOME/.local/share/openriot/install/openriot --eth-info

[module/battery]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --battery
interval = 30
tail = false
format = <label>
format-foreground = ${colors.fg2}
format-offset = 2
format-padding = 0
label = %output%
label-empty =
tooltip = Battery status
click-left = $HOME/.local/share/openriot/install/openriot --battery-notify

[module/openriot-update]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --update-status
interval = 3600
tail = false
format = <label>
format-foreground = ${colors.violet}
format-offset = 2
format-padding = 0
label = %output%
tooltip = OpenRiot update available
click-left = $HOME/.local/share/openriot/install/openriot --update

[module/laptop-monitor]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --laptop-monitor
interval = 10
tail = false
format = <label>
format-foreground = ${colors.fg2}
format-offset = 2
format-padding = 0
label = %output%
label-empty =
tooltip = Toggle laptop monitor
click-left = $HOME/.local/share/openriot/install/openriot --laptop-monitor-toggle

[module/weather]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --weather
interval = 1800
tail = false
format = <label>
format-foreground = ${colors.blue}
format-offset = 0
format-padding = 0
label = %output%
label-empty =
tooltip = Weather

[module/proton-drive]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-proton-drive
interval = 60
tail = false
format = <label>
format-foreground = ${colors.teal}
format-offset = 2
format-padding = 0
label = %output%
label-empty =
click-left = $HOME/.local/share/openriot/install/openriot --proton-drive-sync

[module/transmission]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-transmission
interval = 60
tail = false
format = <label>
format-foreground = ${colors.teal}
format-offset = 2
format-padding = 0
label = %output%
label-empty =
click-left = $HOME/.local/share/openriot/install/openriot --transmission-notify
tooltip = Toggle Transmission

[module/crypto]
type = custom/text
format = "%{T1}%{T-}"
format-foreground = ${colors.teal}
format-offset = 2
format-padding = 0
click-left = $HOME/.local/share/openriot/install/openriot --crypto-notify
tooltip = Crypto prices

[module/night-light]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --night-light-status
interval = 60
tail = false
format = <label>
format-foreground = ${colors.teal}
format-offset = 2
format-padding = 0
label = %output%
label-empty =
click-left = $HOME/.local/share/openriot/install/openriot --night-light-notify
tooltip = Toggle Night Light

[module/wireguard]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --wireguard-status
interval = 10
tail = false
format = <label>
format-foreground = ${colors.cyan}
format-offset = 2
format-padding = 0
label = %output%
label-empty =
click-left = $HOME/.local/share/openriot/install/openriot --wireguard-notify
tooltip = Toggle WireGuard VPN

[module/stealth]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --stealth-status
interval = 10
tail = false
format = <label>
format-foreground = ${colors.cyan}
format-offset = 2
format-padding = 0
label = %output%
click-left = $HOME/.local/share/openriot/install/openriot --stealth-notify
tooltip = Toggle MAC Stealth

[module/cpu]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-metrics
interval = 60
tail = false
format = <label>
format-foreground = ${colors.blue}
format-offset = 2
format-padding = 0
label = %output%
tooltip = CPU usage
click-left = $HOME/.local/share/openriot/install/openriot --cpu-notify

[module/memory]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --polybar-memory
interval = 60
tail = false
format = <label>
format-foreground = ${colors.blue}
format-offset = 2
format-padding = 0
label = %output%
tooltip = Memory usage
click-left = $HOME/.local/share/openriot/install/openriot --mem-notify

[module/power]
type = custom/text
format = ⏻
format-foreground = ${colors.fg}
format-offset = 2
format-padding = 0
click-left = $HOME/.local/share/openriot/install/openriot --power-menu
tooltip = Power menu

[module/settings]
type = custom/text
format = "%{T1}%{T-}"
format-foreground = ${colors.violet}
format-offset = 2
format-padding = 0
click-left = $HOME/.local/share/openriot/install/openriot --settings-menu
tooltip = Settings

[module/lock]
type = custom/text
format = 󰌾
format-foreground = ${colors.fg}
format-offset = 2
format-padding = 0
click-left = $HOME/.local/share/openriot/install/openriot --lock

[module/window-title]
type = custom/script
exec = $HOME/.local/share/openriot/install/openriot --window-title
interval = 2
tail = false
format = <label>
format-foreground = ${colors.fg3}
format-padding = 0
label = %output%
label-empty = " ~"
