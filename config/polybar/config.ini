[module/power]
type = custom/text
format = ⏻%{O2}
format-foreground = ${colors.purple}

format-padding = 0
click-left = $HOME/.local/share/openriot/install/openriot --power-menu

[module/lock]
type = custom/text
format = 󰌾%{O2}
format-foreground = ${colors.purple}

format-padding = 0
click-left = $HOME/.local/share/openriot/install/openriot --lock

